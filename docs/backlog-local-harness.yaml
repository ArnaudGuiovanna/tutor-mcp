    contract_retention: Avant préparation, reçu immuable du schéma validé, des arguments canoniques, de l’effet, de la convention de clé et du tour source ; vérification renouvelée avant dispatch. Les anciennes opérations sans contrat conservé ne sont pas complétées depuis une nouvelle proposition.
    turn_authority: Autorité limitée à un tour ouvert, délivrée une seule fois pour son ancre. Le permis et l’appel préparé conservent un guard révocable ; révocation et admission au dispatch sont ordonnées sous un verrou bref, libéré avant toute attente réseau.
    stop: Révocation mémoire avant écriture durable ; nettoyage limité à la préparation appartenant exactement au parcours. Fin de tour, abandon du parcours ou échec de persistance ne permettent pas de recréer un guard. Dispatched, Unknown et Completed ne deviennent jamais Rejected lors de cet arrêt.
    pedagogical_scope: Machine non raccordée au dispatcher, de contexte vérifié à décision, avec issues terminales REST et CLOSE_SESSION sans inventer une décision ni déclencher une évaluation.
    evidence: Catalogue réel capturé et reçus synthétiques conformes aux handlers ; tests de liens, versions, propriétaires, reprise refusée, stockage défaillant et révocation après admission avec issue inconnue.
    limitations: Aucun nouveau parcours pédagogique activé. Préparation du quiz, soumission, évaluation, ACK de feedback, reprise multi-tour et réconciliation explicite restent à implémenter ; les mutations MCP du pilote restent bloquées.
