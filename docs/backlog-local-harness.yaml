version: 1
title: Harness local Tutor ACP — Qwen GGUF, découverte MCP et contexte borné
authority: Backlog de référence pour toute l’implémentation H00–H12 convenue dans la conversation.
status: IN_PROGRESS
scope:
  objective: Livrer et qualifier le harness local intégré au client ACP, jusqu’à la distribution Windows.
  current_increment: Raccorder découverte sélective, lectures MCP HTTP/stdio, validation déterministe et permissions ACP ; qualifier le vrai modèle avant les écritures pédagogiques.
  preserve_full_goal: true
  server_changes_allowed: false
  exclusions: [LoRA, Needle, modification du serveur Tutor MCP]
status_policy:
  TODO: Travail restant à réaliser et à vérifier.
  IN_PROGRESS: Travail engagé ; ne prouve ni implémentation complète ni validation matérielle.
  DONE: Tous les critères satisfaits avec preuves liées au commit, au modèle et à l’environnement testés.
  dependencies: Gates de validation ; préparation parallèle possible sans déclarer les prérequis satisfaits.
  completion: Un premier incrément partiel ne termine pas l’objectif ; conserver tous les travaux et gates ouverts.
  evidence: Distinguer observations, tests exécutés, cibles de recette et vérifications encore nécessaires.
priority_policy:
  P0: Indispensable au pilote fonctionnel.
  P1: Indispensable à la distribution qualifiée ; ne constitue pas une exclusion du périmètre.

target:
  operating_system: Windows x64
  cpu: Intel Core i7-9750H
  ram_gib: 32
  gpu: NVIDIA Quadro P2000
  vram_gib: 4
  integrated_gpu: Intel UHD Graphics 630
  users: 1
  model: Qwen3-4B-Instruct-2507
  format: GGUF
  quantization: Q4_K_M
  model_sha256: 3605803b982cb64aead44f6c1b2ae36e3acdb41d8e46c8a94c6533bc4c67e597
  gguf_repository: unsloth/Qwen3-4B-Instruct-2507-GGUF
  gguf_revision: a06e946bb6b655725eafa393f4a9745d460374c9
  model_profile: client/local-agent/model-profile.json
  windows_gpu_qualification: PENDING
  qualification_operator: L’utilisateur confirme pouvoir lancer le banc d’essai sur sa machine Windows/P2000.
  qualification_delivery: Préparer un banc d’essai exécutable et un rapport exportable ; attendre ses mesures avant de qualifier le matériel.
  deployment: NOT_PERFORMED

invariants:
  - Aucun changement du serveur MCP, de ses outils, de ses contrats ou de ses règles métier.
  - Employer exactement Qwen3-4B-Instruct-2507 Q4_K_M ; un autre Qwen ne valide pas cette cible.
  - Une instance des poids chargée et une génération active au maximum ; conversations inactives sur disque.
  - Fenêtre initiale de 4096 tokens comprenant entrée, template, schémas, sortie et marge.
  - Catalogue complet en RAM hors prompt ; découverte sélective et un schéma métier actif par défaut.
  - Qwen propose ; le code déterministe valide, contrôle et exécute les opérations MCP.
  - Le serveur reste autorité sur les droits, décisions pédagogiques, versions et progression.
  - Séparer journal exact persistant et projection temporaire envoyée au modèle.
  - Aucun résumé ne remplace une preuve, une réponse d’apprenant, une rubrique ou un reçu serveur.
  - Isoler profils, comptes, institutions, serveurs, permissions, journaux, sessions et contextes actifs.
  - Respecter autoriser, demander et refuser sur l’outil métier réel, même derrière call_tool.
  - Identifiants et versions proviennent d’un état vérifié ; aucune identité fabriquée par le modèle.
  - Préserver idempotence, ordre pédagogique, reprise après panne et état des mutations de résultat inconnu.
  - Annuler localement ne signifie pas annuler une mutation déjà acceptée par le serveur.
  - Préserver comptes, clés, historiques et fonctionnement des agents ACP existants.
  - Aucun secret dans les prompts ; diagnostics sans réponses privées ni jetons de connexion.
  - Toute réduction du contexte doit être traçable et conserver exactement les données indispensables.

architecture:
  process: Agent ACP Rust local livré avec l’application et chargé directement du GGUF.
  external_inference_service_required: false
  sequential_tasks: [choix_operation, preparation_activite, evaluation_proposee, explication_coaching]
  reuse:
    goose:
      source: https://github.com/aaif-goose/goose/tree/main/crates/goose-local-inference
      purpose: Évaluer chargement GGUF, cycle de vie, streaming et intégration ACP.
      decision: Réutiliser directement le couple llama-cpp-2/llama-cpp-sys-2 épinglé par Goose derrière une interface Rust propre.
      constraint: Ne pas importer les prompts de programmation ni l’exécution shell comme comportement Tutor.
    mcp_scout:
      source: https://github.com/mcp-scout/mcp-scout
      purpose: Implémenter en Rust découverte lexicale et exposition des schémas à la demande.
      local_operations: [search_tools, describe_tools, call_tool, list_servers]
    exoharness:
      source: https://github.com/jason571/Exoharness/blob/main/docs/CONTEXT_AND_TOKENS.md
      purpose: Implémentation propre de la séparation journal exact et projection contextuelle.
      constraint: Ne pas reprendre de code AGPL ; ne pas importer la plateforme PostgreSQL.
  proposed_paths:
    local_agent_crate: client/local-agent
    local_agent_manifest: client/local-agent/Cargo.toml
    local_agent_executable: tutor-local-agent
    desktop_manifest: client/src-tauri/Cargo.toml
    desktop_target: tutor-client
    desktop_integration: client/src-tauri/src
    journal_module: client/local-agent/src/journal.rs
    journal_storage: Données privées du profil/local-agent/empreinte_du_propriétaire/UUID_session.sqlite3.
    path_status: Agent, journal, projection et pilote MCP en lecture intégrés ; parcours pédagogiques avec écriture et distribution restent à intégrer.
  context_budget:
    total_tokens: 4096
    default_input_max_tokens: 3072
    default_output_reserved_tokens: 768
    safety_margin_tokens: 256
    counter: Tokenizer réel du GGUF après application du template et ajout des schémas.
    adjustment: Augmenter la réserve de sortie réduit le budget d’entrée à total constant.
    overflow: Décomposer ou signaler la limite ; ne jamais tronquer silencieusement les preuves nécessaires.
  journal:
    source_of_truth: Entrées, arguments, résultats, références et transitions exacts.
    projection: Vue bornée par tâche ; résultats volumineux référencés puis lus de manière ciblée.
    provenance: Identifier origine utilisateur, MCP, état du parcours ou résumé secondaire de chaque élément.
    retention: Définir rétention et effacement explicites sans supprimer les opérations à réconcilier.
    workspace_constraint: Stockage distinct du fichier workspace actuel plafonné à 32 Mio.
    implementation: SQLite DELETE, verrou exclusif par session et synchronous FULL ; entrées et événements immuables, références vérifiées par SHA-256.
    limitations: API de rétention disponible mais interface d’effacement à intégrer ; journal non chiffré ; réconciliation explicite des opérations inconnues à raccorder en H05.

