items:
  - id: H00
    title: Qualification technique et décision de réutilisation
    priority: P0
    status: IN_PROGRESS
    depends_on: []
    work:
      - Épingler versions Goose/llama.cpp/llama-cpp-2, GGUF exact, origine et SHA-256.
      - Décider des composants réutilisés et de la stratégie Rust/MSRV sans imposer une montée de version non évaluée.
      - Qualifier compilation Windows/Pascal, tokenizer, template, annulation et décodage contraint réel.
    acceptance:
      - Le GGUF exact produit une réponse française et une sortie structurée sur la machine Windows/P2000 cible.
      - Versions, pilote, options de compilation, empreinte, mémoire et latences sont consignés.
      - Accès au comptage exact et à la grammaire démontré ; décision Goose ou contrôle llama-cpp-2 documentée.
      - Toute vérification matérielle manquante reste explicitement ouverte ; aucun résultat Linux ne la remplace.

  - id: H01
    title: Agent ACP local
    priority: P0
    status: IN_PROGRESS
    depends_on: [H00]
    work:
      - Créer tutor-local-agent dans client/local-agent et l’intégrer à la découverte et au lancement desktop.
      - Implémenter les opérations ACP utilisées par Tutor, le streaming, les erreurs et le cycle de vie.
    acceptance:
      - Initialisation, création et reprise de session, streaming, annulation et erreurs passent par le client réel.
      - Aucun processus orphelin après fermeture ; une génération interrompue reste identifiée comme telle.
      - Les parcours Codex et Claude existants continuent de fonctionner.

  - id: H02
    title: Runtime GGUF
    priority: P0
    status: IN_PROGRESS
    depends_on: [H00]
    work:
      - Encapsuler chargement, tokenisation, génération, annulation, placement CPU/GPU et libération derrière une interface Rust.
      - Exposer les contrôles réels du moteur pour contexte et décodage contraint.
    acceptance:
      - Plusieurs tours réutilisent un seul chargement des poids et au plus une génération active.
      - Le contexte est explicitement plafonné à 4096 tokens et mesuré avec le tokenizer exact.
      - Une erreur mémoire entraîne un arrêt récupérable ou un repli CPU explicite.
      - Le décodage contraint est testé dans le moteur ; une consigne de produire du JSON ne suffit pas.

  - id: H03
    title: Catalogue et découverte sélective
    priority: P0
    status: IN_PROGRESS
    depends_on: [H01]
    work:
      - Conserver schémas complets, annotations et identités des outils dans un registre lié à la connexion et aux droits.
      - Implémenter recherche lexicale, normalisation des accents, alias français et quatre opérations locales de découverte/appel.
    acceptance:
      - Aucun schéma métier complet dans le contexte initial ; trois candidats au maximum par recherche et un schéma actif par défaut.
      - Sur au moins 60 formulations françaises annotées, l’outil attendu apparaît dans les trois premiers dans au moins 95 % des cas.
      - Le catalogue est invalidé lors des changements de compte, institution, serveur ou droits et actualisé sur changement annoncé des outils.

  - id: H04
    title: Journal exact d’exécution
    priority: P0
    status: IN_PROGRESS
    depends_on: [H01]
    work:
      - Créer SQLite par profil pour tours, opérations, arguments, résultats, références pédagogiques et états d’avancement.
      - Définir stockage distinct du workspace, rétention, effacement et provenance des données.
    acceptance:
      - Après arrêt forcé, distinguer opérations terminées, en attente et de résultat inconnu.
      - Projections et résumés ne modifient jamais les originaux ; profils et comptes restent isolés.
      - Un échec d’écriture durable empêche toute nouvelle mutation.
      - Rétention et effacement sont explicites ; diagnostics sans contenus privés et journal non limité par les 32 Mio du workspace.

  - id: H05
    title: Exécuteur déterministe
    priority: P0
    status: IN_PROGRESS
    depends_on: [H03, H04]
    work:
      - Valider outil, schéma, arguments, permissions et préconditions avant appel.
      - Gérer délais, erreurs, limites de boucle, clés d’idempotence et réconciliation des résultats inconnus.
    acceptance:
      - Aucun outil inconnu, interdit ou aux arguments invalides n’est exécuté ; identifiants et versions viennent de l’état vérifié.
      - Les reprises conservent les mêmes arguments et la même clé selon la convention réelle de chaque outil.
      - Les pannes avant et après réponse serveur ne provoquent aucune double mutation.
      - Annuler localement ne déclare pas annulée une mutation acceptée ; les boucles et tentatives sont bornées.

  - id: H06
    title: Construction et réduction du contexte
    priority: P0
    status: IN_PROGRESS
    depends_on: [H02, H04]
    work:
      - Construire une projection par tâche avec instructions, contrat actif, données indispensables et échanges récents.
      - Référencer les gros résultats dans le journal, permettre leurs lectures ciblées et tracer chaque réduction.
      - Adapter la voie locale de backend.rs pour éviter que pedagogical_prompt réinjecte à chaque tour ses instructions et huit messages déjà journalisés ; conserver la voie des agents externes.
    acceptance:
      - Chaque requête respecte le budget réel, template et schémas inclus ; texte et structuredContent équivalents ne sont pas doublés.
      - Contraintes, rubriques et réponses nécessaires restent exactes et reliées à leur provenance.
      - Cent tours incluant de gros résultats ne provoquent aucune croissance non bornée du contexte.
      - Un dépassement incompressible entraîne décomposition ou limite explicite, jamais une évaluation sur preuves tronquées.

  - id: H07
    title: Parcours pédagogiques déterministes
    priority: P0
    status: IN_PROGRESS
    depends_on: [H05, H06]
    work:
      - Modéliser formation active, séance, décision, préparation, affichage, réponse, évaluation, feedback et reprise.
      - Exécuter les parcours connus par code, sans redécouverte systématique ni transfert d’autorité pédagogique au modèle.
    acceptance:
      - Pour un quiz, préparation réussie avant affichage, réponse exacte soumise avant évaluation et rubrique inchangée.
      - Le feedback n’est enregistré comme livré qu’après livraison ; une flashcard reste une autoévaluation.
      - Interruption et changement de formation ne rattachent jamais une réponse à une autre tentative.

  - id: H08
    title: Génération et coaching
    priority: P0
    status: TODO
    depends_on: [H02, H06, H07]
    work:
      - Définir des tâches courtes pour préparer une activité, proposer une évaluation, expliquer, donner un indice et accompagner une difficulté.
      - Cadrer sorties structurées et textes par le contrat pédagogique, les limites du modèle et la langue choisie.
    acceptance:
      - Les activités respectent le contrat serveur et le format UI sans révéler prématurément la correction.
      - Une estimation n’est jamais présentée comme une maîtrise démontrée ; réponses dans la langue choisie.
      - Une sortie invalide reçoit au plus une tentative de correction, puis une erreur explicite.

  - id: H09
    title: Intégration à l’expérience Tutor
    priority: P1
    status: TODO
    depends_on: [H01, H05, H07]
    work:
      - Ajouter choix Qwen local, sélection du GGUF, chargement, arrêt, permissions et renouvellement de connexion Tutor.
    acceptance:
      - Le compte Tutor reste distinct du moteur local ; autoriser/demander/refuser s’applique à l’outil métier réel.
      - Aucune clé ou jeton dans le prompt ; reprise, changement de compte et expiration ne rejouent pas une ancienne réponse.
      - États accessibles en français et anglais, avec fonctionnement des agents existants préservé.

  - id: H10
    title: Qualification fonctionnelle et pédagogique
    priority: P0
    status: TODO
    depends_on: [H03, H04, H05, H06, H07, H08]
    work:
      - Versionner un corpus de parcours réels, cas ambigus et erreurs ; séparer tests déterministes, tests Qwen et revue humaine.
      - Définir la grille pédagogique avant les essais et conserver les résultats liés au GGUF épinglé.
    acceptance:
      - Au moins 100 scénarios exécutés trois fois avec le GGUF exact ; au moins 90 % de réussite complète des parcours pris en charge.
      - Zéro violation dans la suite des permissions, identités, absence de doublons, ordre d’évaluation et conservation des preuves.
      - Coaching évalué humainement avec la grille prédéfinie ; les métriques ne se limitent pas à la validité JSON.

  - id: H11
    title: Optimisation sur P2000
    priority: P1
    status: TODO
    depends_on: [H02, H06, H10]
    work:
      - Mesurer puis régler couches GPU, batch, threads CPU, placement KV et sorties ; comparer au fonctionnement CPU.
      - Vérifier les cibles de recette ci-dessous sans dégrader qualité ni invariants.
    acceptance:
      - Rapport sur la P2000 réelle avec mémoire, chargement froid, traitement du prompt, premier texte, débit et durée par parcours.
      - Au moins une heure et 100 tours sans OOM, fuite progressive ni croissance mémoire continue.
      - Toute optimisation conserve les résultats fonctionnels et pédagogiques exigés.
      - Les cibles non atteintes sont déclarées ; aucune substitution de matériel ou modification silencieuse des seuils.

  - id: H12
    title: Distribution Windows
    priority: P1
    status: TODO
    depends_on: [H09, H10, H11]
    work:
      - Intégrer agent et bibliothèques natives à l’installateur, verrouiller les dépendances et documenter le modèle compatible.
    acceptance:
      - Installation et génération sur Windows sans environnement de développement, y compris chemins avec espaces et accents.
      - Mise à jour conservant comptes et historiques ; empreintes, notices et provenance des composants présentes.
      - Rapport lié au commit exact, avec contrôle prouvant l’absence de changement serveur.
      - Distinguer qualification locale, CI, publication et déploiement ; aucun succès externe déduit des seuls tests locaux.

implementation_order:
  - stage: 1
    items: [H00, H01, H02]
    deliverable: Écrire dans Tutor et recevoir une réponse du GGUF local.
  - stage: 2
    items: [H03, H04, H05, H06]
    deliverable: Découvrir et exécuter un outil, journaliser exactement son résultat et construire un contexte borné.
  - stage: 3
    items: [H07, H08]
    deliverable: Quiz complet avec fermeture et reprise de l’application.
  - stage: 4
    items: [H09, H10]
    deliverable: Parcours utilisateurs intégrés et fiabilité mesurée.
  - stage: 5
    items: [H11, H12]
    deliverable: Optimisation et qualification de l’application installée sur la machine cible.
first_end_to_end_milestone:
  steps: [ouvrir_seance, obtenir_activite, preparer_quiz, fermer_application, reprendre, soumettre_reponse, recevoir_feedback]
  lifecycle: Un seul chargement par processus ; après fermeture, recharger les poids et reprendre depuis le journal.
  completion_limit: Ce jalon démontre la première chaîne complète mais ne termine pas H00–H12.

performance_targets:
  status: PROPOSED_NOT_MEASURED
  measurement_rule: Séparer temps locaux, attentes MCP et temps utilisateur ; baseline H00 puis qualification H11.
  context_tokens_max: 4096
  simultaneous_generations_max: 1
  free_vram_target_mib: 512
  vram_note: Marge indicative à ajuster explicitement selon l’usage de l’écran et les mesures.
  median_generation_tokens_per_second_min: 8
  warm_first_useful_text_p95_seconds_max: 15
  first_text_input_tokens: 1000
  cancellation_seconds_max: 2
  cancellation_ui: Réaction immédiate de l’interface.
  endurance_minutes_min: 60
  endurance_turns_min: 100
  measured_results: []
later_optimizations:
  condition: Après fiabilité et qualité pédagogique validées avec le contexte court.
  candidates: [réutilisation du préfixe KV, quantification du KV, élargissement du contexte]
  constraint: Aucune optimisation ultérieure ne remplace les critères du périmètre initial.
