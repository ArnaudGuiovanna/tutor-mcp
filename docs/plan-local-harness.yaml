  constraints: Écritures disjointes, pas de publication autonome, pas de changement serveur et pas de déclaration de qualification sans preuve.
  dispatch: Quatre subagents effectivement lancés le 2 novembre 2026 ; leurs identifiants ci-dessous correspondent aux appels de délégation de cette session.
