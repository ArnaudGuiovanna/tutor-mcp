implementation_checkpoint:
  scope: Sources de l'agent natif ; aucun nouvel installateur ni profil matériel qualifié.
  native_observation_contract: docs/local-harness/native-observations.yaml
  native_observation_report: docs/local-harness/native-observation-baseline.json
  implemented: Mesures optionnelles et versionnées du moteur, du transport MCP et du worker ACP, y compris les erreurs observées.
  verified: 206 tests natifs réussis, deux essais GGUF spéciaux ignorés ; neuf cas de développement avec le GGUF épinglé, Tutor réel temporaire et une connexion refusée.
  limits: Ces cas connus ne qualifient ni la compréhension générale, ni la pédagogie, ni la réponse utile dans l'UI, ni Windows/P2000.
  resident_contract: docs/local-harness/resident-integration.yaml
  resident_source: Worker/contexte résidents, cache confirmé après journal, connexion MCP réutilisable, projection de preuves à alias stables et liaison durable à la conversation intégrés derrière options explicites.
  resident_checks: 228 tests sans inférence et 237 tests avec moteur natif réussis ; trois essais GGUF ignorés par cette suite, Clippy strict réussi.
  next: Vérifier le banc apparié sur vrai Tutor/GGUF, puis terminer la fraîcheur du catalogue, l'état pédagogique et les capacités ; aucun gain produit présumé.

invariants:
  - Le serveur reste autorité sur les droits, formations, versions, décisions et progression.
  - Le modèle propose une intention ou une explication ; Rust décide de l'admission, construit les paramètres prouvés et exécute les outils.
  - Aucun appel déclenché par la seule proximité vectorielle ; aucun score déclaré par le LLM ne confère une autorisation.
  - Les identifiants proviennent de l'identité vérifiée, du contexte actuel ou d'un résultat serveur journalisé ; jamais d'une invention du modèle.
  - Une instance de poids et une génération active ; contexte, listes et caches isolés par propriétaire, serveur, conversation et modèle.
  - Une annulation ne signifie pas qu'une mutation distante a été annulée ; un résultat inconnu reste à réconcilier sans rejeu automatique.
  - Le journal conserve les entrées, preuves et reçus exacts ; une projection ou un résumé ne les remplace pas.
  - Aucun secret ni réponse privée dans les diagnostics exportés ; les textes des cas d'essai proviennent de fixtures ou d'un export explicitement choisi.
  - Tout budget compte tokenizer, template, capacités, données et sortie ; une preuve requise n'est jamais tronquée silencieusement.
  - Une phrase non reconnue n'autorise pas une affirmation comme « aucun accès au profil » sans preuve de cette indisponibilité.
  - Les agents ACP existants, données utilisateur et politiques d'autorisation continuent de fonctionner.

architecture:
  fast_path: Message et état vérifié → candidats sémantiques et classificateur calibré → capacité admise → MCP → rendu structuré sourcé.
  llm_path: Message, état utile et quelques capacités → décision bornée ou réponse pédagogique ; lectures exécutées par Rust ; synthèse supplémentaire seulement si nécessaire.
  uncertainty: Rejet du classificateur, référence non résolue ou demande composée → analyse LLM bornée ou clarification ciblée ; pas de choix forcé.
  capabilities: Registre métier local associé aux outils vivants ; catalogue et schémas complets hors contexte ; descriptions courtes seulement pour les candidats.
  dialogue_state: Formation, objectif, activité, question attendue, dernière liste, difficulté et informations manquantes, avec provenance et version.
  context_manager: État obligatoire + historique récent sélectionné + preuves retrouvées ; budget exact 2048 puis 4096 si les mesures le justifient.
  resident_runtime: Worker d'inférence propriétaire du backend, du modèle et des états de contexte ; préfixes stables avant données variables.
  resident_mcp: Connexion et catalogue liés à l'identité et à la conversation ; invalidation sur rebind, droits, configuration ou annonce de changement.
  system_prompt: Rôle de tuteur généraliste, usage des capacités et distinction données confirmées/inconnues ; consignes stables, adaptées au modèle, sans catalogue exhaustif ni raisonnement long imposé.
  optional_encoder: Petit encodeur multilingue CPU local, par exemple via fastembed-rs ; un classificateur entraîné et calibré sur les intentions Tutor est à comparer à la décision LLM bornée.

shared_contracts:
  status: PROPOSED ; noms définitifs à stabiliser dans LH-00, avant les modifications concurrentes des modules centraux.
  owner_binding:
    responsibility: Identité locale et distante vérifiée, origine serveur, conversation et génération de liaison.
    source: Réutiliser les bindings et preuves de host_context/call_validation ; ne pas créer une deuxième identité indépendante.
    cache_rule: Un changement d'autorité invalide connexion, propositions en attente, sélections et caches concernés ; un renouvellement de transport n'autorise aucun rejeu.
  dialogue_snapshot:
    responsibility: État du tour courant, version de sélection, dernier exercice et dernière liste, chaque fait lié à une référence de journal et à son origine.
    owner: context_routing
    unavailable: Distinguer absent, inconnu, périmé, refusé et erreur ; aucun de ces états n'est une chaîne vide supposée confirmée.
  capability_proposal:
    responsibility: Intention, références utilisateur et paramètres non autoritaires proposés par routeur ou modèle.
    owner: context_routing
    admission: Le registre Rust résout les références, contrôle schéma et préconditions puis fournit un plan ; une proposition n'est pas un permis.
  admitted_execution:
    responsibility: Opérations métier typées, preuves de paramètres, politique d'autorisation et garde de tour déjà fournis par l'exécuteur.
    owner: mcp_capabilities
    result: Reçus immuables puis sélection exacte des faits nécessaires ; erreur ou issue inconnue ne deviennent pas une réponse de succès.
  inference_request:
    responsibility: Messages projetés, budget exact, profil modèle, clé de contexte admissible, mode de sortie et annulation.
    owner: runtime_cache
    compatibility: Les clés de cache ne sont jamais construites à partir d'un texte utilisateur ; l'adaptateur ACP fournit le binding vérifié.
  turn_observation:
    responsibility: Horodatages monotones et durées de phases, tokens comptés/réutilisés/produits, backend et effet utilisateur observable.
    owner: qualification
    privacy: Aucun texte de prompt, réponse privée, clé, jeton ou argument métier sensible dans les mesures techniques exportées par défaut.
    compatibility: Champs ACP historiques conservés ; extensions optionnelles et versionnées ; les essais déclarent les métriques manquantes plutôt que de les inventer.

parallel_work_rules:
  - Chaque implémentation commence par les contrats partagés correspondant à son incrément ; la liste paths décrit la surface prévue et n'autorise pas deux agents à éditer le même fichier simultanément.
  - Un agent propriétaire par fichier central ; le principal attribue les adaptations acp.rs/harness.rs et intègre les autres lots après revue.
  - Les tâches TODO peuvent être préparées en parallèle, mais leur validation attend leurs dépendances.
  - Les tests lourds et benchmarks CPU/GPU ne sont pas lancés simultanément sur le même matériel ; la concurrence fausserait les comparaisons.
  - Aucun lot ne modifie les seuils, les annotations de référence ou les tests tenus à part pour obtenir un résultat favorable.

