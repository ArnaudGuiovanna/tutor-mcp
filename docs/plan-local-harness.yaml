delivery_order:
  - increment: A
    purpose: Mesurer et réduire les coûts techniques avec le modèle actuel, sans changer simultanément de modèle et de stratégie d'intention.
    items: [LH-00, LH-01, LH-02]
  - increment: B
    purpose: Relier compréhension, état pédagogique et capacités réelles ; préparer l'évaluation indépendante avant le réglage du routeur.
    items: [LH-03, LH-04, LH-05, LH-06, LH-07]
  - increment: C
    purpose: Étendre la boucle pédagogique vérifiée, comparer moteurs/modèles et exploiter le matériel cible.
    items: [LH-08, LH-09, LH-10]
  - increment: D
    purpose: Qualifier la chaîne complète sur Windows/P2000 puis livrer une préversion accompagnée de résultats vérifiables.
    items: [LH-11, LH-12]

items:
  - id: LH-00
    title: Mesures de référence et attribution des délais
    owner: runtime_cache
    status: IN_PROGRESS
    depends_on: []
    paths: [client/local-agent/src/runtime.rs, client/local-agent/src/acp.rs, client/scripts/qualify-local-agent.py]
    acceptance:
      - Séparer vérification/chargement des poids, tokenisation, allocation, prefill, décodage, routage, connexion/appel MCP, attente humaine et affichage.
      - Distinguer premier token interne, première réponse utile et réponse terminée ; ne pas afficher un statut comme une réponse utile.
      - Relever froid/chaud et versions, empreintes, options et environnement ; préserver les champs ACP existants via métadonnées optionnelles.
      - Reproduire une référence avec le GGUF actuel, sur données temporaires et serveur local réel ; absence de matériel cible marquée INCOMPLETE.
    evidence_required: Rapport brut associé au commit et aux artefacts ; aucun résultat du microbenchmark de recherche n'est assimilé à une mesure produit.
    checkpoint: Contrat natif et cas de développement dans native-observations.yaml ; ACP existant conservé. Attribution UI/routage/permissions, mesure utile et banc portable restent à réaliser.

  - id: LH-01
    title: Worker résident et cache d'inférence isolé
    owner: runtime_cache
    status: IN_PROGRESS
    depends_on: [LH-00]
    paths: [client/local-agent/src/runtime.rs, client/local-agent/src/acp.rs, client/local-agent/src/harness.rs]
    acceptance:
      - Préserver ownership et durée de vie modèle/contexte sans élargir implicitement les garanties Send/Sync ni utiliser une durée de vie fabriquée.
      - Réutiliser seulement le préfixe de tokens réellement identique et admissible dans le bon binding ; exposer tokens réutilisés et recalculés.
      - Tester changement d'identité, de serveur, de conversation, de modèle, de template et de budget ; aucune fuite ou sélection de contexte périmé.
      - Après erreur, annulation, sortie maximale ou éviction, produire une nouvelle réponse correcte et journalisée, sans queue ni tokens résiduels.
      - Comparer cache actif/inactif sur les mêmes requêtes ; premier fragment et décision complète mesurés séparément, modèle et paramètres constants.
    checkpoint: Worker/contexte unique et cache raccordés à ACP ; promotion après fin durable seulement, invalidation aux erreurs. Interruption native pendant prefill et campagne complète restent non qualifiées.

  - id: LH-02
    title: Connexion MCP et catalogue résidents
    owner: mcp_capabilities
    status: IN_PROGRESS
    depends_on: [LH-00]
    paths: [client/local-agent/src/harness.rs, client/local-agent/src/mcp_client.rs, client/local-agent/src/mcp_stdio.rs, client/local-agent/src/acp.rs]
    acceptance:
      - Réutiliser une connexion HTTP/stdio et le catalogue sur deux tours admissibles ; mesurer le coût supprimé et le coût réel des appels.
      - Révoquer les anciens bindings sur changement de compte, serveur, conversation ou autorisation ; actualiser le catalogue vivant.
      - Un échec de transport n'entraîne aucun rejeu automatique d'une opération envoyée ; les mutations inconnues restent identifiées.
      - Annulation, rebind, EOF et fermeture du client libèrent transports et processus ; permissions toujours vérifiées sur l'outil métier réel.
    checkpoint: Connexion HTTP/stdio réutilisable, lease exclusive et nettoyage contrôlé raccordés ; catalogue encore relu à chaque lease, donc critère de catalogue résident non satisfait.

  - id: LH-03
    title: État pédagogique persistant et projection bornée
    owner: context_routing
    status: IN_PROGRESS
    depends_on: [LH-00]
    paths: [client/local-agent/src/context.rs, client/local-agent/src/session_store.rs, client/local-agent/src/journal.rs, client/local-agent/src/host_context.rs]
    acceptance:
      - Restaurer formation, activité, question attendue et dernière liste après redémarrage à partir de références vérifiables.
      - Distinguer explicitement faits serveur, propos de l'apprenant, hypothèses et résumés secondaires ; aucun résumé ne devient preuve de maîtrise.
      - Résoudre « la deuxième », « on reprend » et « je bloque » uniquement avec l'état correspondant ; clarifier si cet état manque ou est périmé.
      - Conserver le journal complet et les preuves requises après cent tours ; toute omission est traçable et le budget exact est respecté.
      - Préserver un ordre stable du prompt sans remettre identifiants aléatoires ni données variables dans son préfixe stable.
    checkpoint: Labels de preuves stables et audit séparé intégrés ; affinité durable du journal à la conversation. Activité, question attendue et dernière liste avec accusé UI restent à intégrer.

  - id: LH-04
    title: Registre de capacités et premières lectures utiles
    owner: mcp_capabilities
    status: TODO
    depends_on: [LH-02, LH-03]
    paths: [client/local-agent/src/fast_harness.rs, client/local-agent/src/harness.rs, client/local-agent/src/catalog.rs, client/local-agent/src/executor.rs]
    acceptance:
      - Profil composé de champs sourcés, formation active distincte des formations accessibles, historique et niveau inconnus signalés honnêtement.
      - Recherche via list_training_library, pagination exacte, distinction liste vide/accès refusé/erreur et absence de sélection implicite.
      - Un choix de formation utilise l'identifiant d'un résultat réel et le contrat de sélection/version du serveur ; un numéro seul ne devient pas un ID inventé.
      - Quelques capacités pertinentes seulement sont montrées au modèle ; le catalogue complet ne rejoint pas son prompt.
      - Schémas, permissions, garde de tour et arguments vérifiés sont conservés ; une capacité manquante ne devient pas une autorisation générique.

  - id: LH-05
    title: Corpus indépendant et protocole de comparaison
    owner: qualification
    status: TODO
    depends_on: [LH-00]
    acceptance:
      - Réserver au test tenu à part au moins 200 demandes et 50 dialogues français avec cas ordinaires et difficiles ; consigner intention, préconditions, effets attendus et références.
      - Constituer entraînement et calibration en dehors de ces volumes ; paraphrases d'un même scénario restent dans le même groupe ; le test tenu à part n'est pas utilisé pour régler le routeur.
      - Couvrir fautes, négations, explication sans consultation, références, demandes composées, permissions, pagination et changements de conversation.
      - Garder les huit cas de recherche comme régressions connues, sans les compter comme preuve de généralisation.
      - Conserver aussi discovery-fr.json comme régression réglée historiquement ; ses 80 requêtes et leurs paraphrases ne constituent pas un test indépendant.
      - Définir la réussite du parcours et les critères de coaching avant de comparer les configurations ; revue des annotations et des ambiguïtés.

  - id: LH-06
    title: Routage sémantique avec rejet et repli borné
    owner: context_routing
    status: TODO
    depends_on: [LH-03, LH-04, LH-05]
    acceptance:
      - Comparer encodeur CPU/classificateur calibré, décision LLM bornée et cascade sur le même corpus et les mêmes capacités.
      - Mesurer latence et mémoire du routeur ainsi que les actions fausses et clarifications inutiles ; ni proximité vectorielle ni confiance auto-déclarée du LLM ne suffit à exécuter.
      - Conserver les négations, résoudre les références vérifiées et traiter les demandes composées sans supprimer un de leurs objectifs.
      - Un rejet produit une analyse bornée ou une clarification utile ; une demande de données n'est pas envoyée aveuglément à un chat qui invente son indisponibilité.
      - Au moins 95 % d'intentions/parcours correctement traités sur le test tenu à part, avec résultats par catégorie et dénominateurs explicites.

  - id: LH-07
    title: Intégration ACP des deux chemins
    owner: integration_owner
    status: TODO
    depends_on: [LH-01, LH-04, LH-06]
    acceptance:
      - Les lectures factuelles rendues par Rust n'imposent pas de synthèse LLM ; l'explication générale ne subit pas deux générations obligatoires.
      - Une génération supplémentaire est réservée aux demandes qui nécessitent une lecture puis une explication ; les étapes et budgets sont explicites.
      - Statuts UI issus de phases réelles, streaming, autorisations, arrêt et reprise restent accessibles et sans faux succès.
      - Tester les chemins depuis l'application ACP, y compris rebind, journal et agents externes ; un test du routeur seul ne valide pas ce lot.

  - id: LH-08
    title: Boucle pédagogique vérifiée
    owner: mcp_capabilities
    status: TODO
    depends_on: [LH-03, LH-04, LH-07]
    acceptance:
      - Relier reprise, activité, demande d'indice et explication au programme et à la sélection confirmés par Tutor.
      - Raccorder progressivement les transitions de pedagogical.rs, avec préconditions explicites pour préparation, tentative, feedback et enregistrement.
      - Appliquer les règles existantes de formation personnelle pour une demande d'apprentissage ; retrouver une formation avant toute création, et ne pas recréer un résultat existant.
      - Toute écriture possède arguments prouvés, permission, clé d'idempotence et reçu ; refus/annulation/panne ne créent ni progression inventée ni double enregistrement.
      - Une tentative réelle précède l'évaluation ; le LLM ne valide pas sa propre réponse comme réussite de l'apprenant ; les limites d'une correction non déterministe sont explicites.
      - Qualifier de vrais échanges apprenant/tuteur avec le serveur inchangé, et pas seulement des reçus simulés.

  - id: LH-09
    title: Profils de modèles et moteur compatible
    owner: runtime_cache
    status: TODO
    depends_on: [LH-01, LH-04, LH-05]
    acceptance:
      - Profils explicites avec architecture, GGUF/révision/SHA-256, licence, tokenizer, template, format d'outil, sampler et budgets ; aucun échange silencieux de modèle.
      - Évaluer Qwen3-1.7B de référence, LFM3-1.7B, Qwen3.5-2B et LFM2.5-2.6B après vérification de compatibilité ; un candidat indisponible reste INCOMPLETE.
      - Adapter chaque format d'outils et vérifier les tokens réellement présentés au modèle ; JSON valide ne vaut pas intention correcte.
      - Mesurer préfixe, état récurrent et désactivation du raisonnement ; un candidat trop lent ou incompatible n'est pas retenu malgré ses scores publiés.
      - Comparer qualité française, parcours et coaching sous le même harness ; ne pas comparer directement BFCL v3 et v4 ni transposer BF16 à Q4 sans essai.
    model_decision: Aucune adoption dans le lot de planification ; un rapport de comparaison doit motiver le profil retenu.
    scheduling: Préparer les adaptateurs et comparer les candidats pendant LH-06, sans exiger que Qwen atteigne déjà le seuil final ; l'adoption produit attend LH-11 et les parcours ACP intégrés.

  - id: LH-10
    title: Accélération et enveloppe matérielle
    owner: runtime_cache
    status: TODO
    depends_on: [LH-01, LH-09]
    acceptance:
      - Construire un backend compatible Pascal sm_61 avec chaîne CUDA 12.9 ou antérieure et version llama.cpp épinglée ; tester Vulkan séparément.
      - Détecter la vraie carte et la VRAM libre, mesurer placement effectif des couches, buffers et cache ; UHD 630 ne remplace pas la P2000.
      - Comparer CPU, CUDA et Vulkan sur le même PC, le même modèle et les mêmes requêtes, avec vérification de qualité à chaque backend.
      - Préserver une génération active et un budget initial de 3,2 Gio de VRAM en charge ajusté à la mémoire libre ; repli CPU explicite et mesuré si nécessaire.
      - Mesurer alimentation secteur, échauffement et stabilité sur une conversation prolongée ; une compilation CUDA ne valide pas l'inférence.

  - id: LH-11
    title: Banc d'essai et décision sur Windows/P2000
    owner: qualification
    status: TODO
    depends_on: [LH-07, LH-08, LH-09, LH-10]
    acceptance:
      - Fournir une commande ou interface simple depuis le paquet Windows et un rapport exportable associé au commit, modèle, pilote et paramètres exacts.
      - Rejouer les scénarios avec le vrai serveur local temporaire puis le client installé ; toute institution réelle reste hors des fixtures automatiques.
      - Rapporter froid/chaud, cache touché/manqué, première réponse utile et total ; isoler attentes humaines sans les faire disparaître du temps total observé.
      - Sur les parcours concernés à chaud, viser réponse utile médiane au plus 2 s, p95 au plus 4 s et génération au moins 15 tokens/s ; mesurer séparément routeur, outils et coaching.
      - Publier les répétitions, catégories, erreurs et dénominateurs ; aucun percentile sur trois observations ni succès sur une assertion sautée.
      - Corpus indépendant, dialogues et revue pédagogique réussis ; chaque critère reçoit GO, NO_GO ou INCOMPLETE, absence de GPU exclut GO matériel.

  - id: LH-12
    title: Distribution et validation utilisateur
    owner: integration_owner
    status: TODO
    depends_on: [LH-11]
    acceptance:
      - Installer et mettre à jour sans perdre comptes, clés, conversations, formations, journaux et modèles compatibles.
      - Livrer un installateur versionné, profils exacts, rapports et SHA-256 ; vérifier les empreintes des assets GitHub après envoi.
      - Vérifier les contrôles GitHub requis du commit puis publier staging et main via finish_task ; distinguer publication, installation et qualification matérielle.
      - Un résultat Windows manquant ou un critère NO_GO reste déclaré ; une préversion de test n'est jamais présentée comme distribution qualifiée.

decisions:
  fixed: [serveur inchangé, journal exact, autorisations existantes, budgets mesurés, intégration Rust locale]
  pending: [stratégie de routage gagnante, encodeur éventuel, modèle et quantification, backend P2000, nombre de contextes résidents, politique d'éviction]
  selection_rule: Choisir sur la qualité et le temps de réponse utile de bout en bout, en conservant les refus corrects et l'isolation ; pas sur la taille ou le débit seuls.

validation_commands:
  available_now:
    - python3 -B client/scripts/qualify-local-agent.py --help
    - python3 -B client/scripts/qualify-local-harness.py --help
    - python3 -B client/scripts/qualify-local-context.py --help
    - bash scripts/verify-local-agent.sh
    - python3 scripts/finish_task.py publish
  to_implement: Le banc multi-configurations, la mesure de réponse utile UI et les exports Windows de LH-11 ; aucune commande inexistante n'est présentée comme disponible.

completion_policy:
  planning: Les quatre lots sont rédigés, relus, liés à ce plan et les dépendances/critères sont cohérents ; cela ne termine pas l'implémentation.
  implementation: Les douze lots techniques et la référence LH-00 disposent de preuves correspondant à tous leurs critères.
  hardware: Seules des observations sur le PC Windows/P2000 exact valident la fluidité cible.
  publication: Toute modification terminée respecte AGENTS.md, préserve les fichiers hors lot et publie par le workflow mainteneur.
