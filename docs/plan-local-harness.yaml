objective:
  product: Un tuteur local qui comprend les demandes dans la conversation pédagogique, utilise les capacités Tutor appropriées et répond dans un délai acceptable.
  implementation: Agent ACP Rust, GGUF chargé localement, journal exact, état pédagogique compact, contexte d'inférence réutilisable, connexion MCP persistante et exécuteur déterministe.
  target: Windows x64, Intel Core i7-9750H, 32 Gio RAM, Quadro P2000 4 Gio, un utilisateur.
  exclusions: [modification du serveur MCP, LoRA, Needle]
  model_selection: Comparer des configurations complètes ; aucun nouveau modèle n'est adopté sur la seule base de ses benchmarks publiés.
  completion: Tous les critères fonctionnels, pédagogiques, de latence et de distribution sont vérifiés sur le commit et le matériel cibles ; une CI verte ou un lot initial ne suffit pas.
  qualification_operator: L'utilisateur a confirmé pouvoir exécuter le futur banc sur son PC Windows/P2000 ; demander ce lancement seulement lorsque le paquet et son rapport exportable sont prêts.

