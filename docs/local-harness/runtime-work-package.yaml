actor_contract:
  status: IN_PROGRESS
  public_adapter: Préserver Engine:Send et ses méthodes synchrones ; un handle Send transporte des commandes possédées vers un thread dédié.
  ownership: Le thread crée backend, modèle, puis contexte ; il effectue seul tokenisation, prefill, sampling et accès KV.
  lifetimes: |
    worker(config, rx) possède backend puis model comme variables locales.
    run_context_epoch(&model, &backend, rx) crée LlamaContext<'model>, batch et état de cache.
    La boucle interne traite plusieurs commandes sans déplacer ces objets hors de ce scope.
    Une reconfiguration quitte cette boucle, détruit contexte/sampler/batch, puis crée une nouvelle époque.
    Une sortie définitive détruit contexte, modèle et backend dans cet ordre.
  forbidden_shortcuts: Pas de struct auto-référente improvisée, transmute vers 'static, fuite Box::leak ou impl Send/Sync ajouté au contexte.
  lazy_load: Premier besoin de tokenizer/génération charge et vérifie le modèle ; une lecture rendue par Rust ne doit pas charger le GGUF.
  artifact_integrity: GGUF vérifié puis traité comme immuable pendant son mmap ; qualifier la course entre hash et chargement, interdire toute réécriture en place.
  model_residency: Une allocation de poids par worker sain ; changer de contexte ou de session ne recharge pas les poids.
  commands:
    - CountInput avec messages possédés, scope, job_id, annulation et canal de résultat ; ne modifie jamais le KV.
    - Generate avec InferenceRequest possédé, scope, budget, mode, job_id et canal d'événements borné.
    - Finalize avec job_id et issue journalisée ; valide la candidature au cache ou l'invalide.
    - Invalidate avec motif typé et époque cible ; acquittement avant admission du travail suivant.
    - Shutdown ; annule l'actif, ferme les canaux, détruit les ressources et joint le thread hors boucle ACP.
  bridge: |
    Engine::generate garde emit et &AtomicBool sur le thread appelant ; ces références ne traversent pas le canal.
    Le proxy pompe les événements, appelle emit et répercute l'annulation dans un Arc<AtomicBool> propre au job.
    count_input utilise le même pont pour surveiller son annulation, sans envoyer une référence empruntée.
    Une erreur de emit annule le job, vide ses événements et attend son acquittement ; aucune émission tardive n'est admise.
  limits: File de commande de capacité 1, chunks bornés en nombre et en octets ; pas de backlog non borné de générations.
  cancellation_priority: Signal atomique hors file ; try_send/recv avec attente courte annulable, jamais un envoi bloquant sans borne.
  scheduler: ACP conserve son refus -32003 d'une seconde génération ; le worker ne traite aucun CountInput concurrent au decode actif.
  generation_identity: (époque du worker, session ACP, tour, génération) ; rejeter événements et Finalize d'un ancien job.
  liveness: Un timeout Tokio ne tue pas un thread natif ; si le worker ne répond plus, ne pas créer un second worker en parallèle.
  fatal_recovery: Arrêter le processus agent et laisser le client le relancer ; résultat interrompu/inconnu conservé, aucun rejeu automatique.

cache_contract:
  status: IN_PROGRESS
  trust: Scope fourni par l'adaptateur ACP depuis les bindings vérifiés ; jamais extrait d'une intention, d'un prompt ou d'un ID proposé par le LLM.
  identity_fields:
    - profile_id et account_id de session_store::Owner.
    - institution via Owner.tenant_id et serveur via Owner.server_id, validés par la liaison hôte existante.
    - session ACP, UUID durable de conversation et époque de connexion/reprise ; pas de réutilisation entre conversations.
    - Époque de droits et de liaison non secrète, actualisée par rebind/changement de configuration.
  execution_fields:
    - SHA-256 réellement vérifié du GGUF, version du profil et identité du moteur/build/backend/périphérique.
    - Empreinte des octets du template, options de rendu, tokenizer/tokens spéciaux et mode de raisonnement.
    - Version des instructions, mode de sortie/format d'outil, grammaire et configuration sampler.
    - Contexte alloué, type KV, RoPE, batch et paramètres d'exécution pertinents ; première version conservatrice.
  missing_identity: Désactiver la réutilisation et vider le contexte ; un parcours anonyme compatible peut continuer à froid.
  storage: Mémoire du worker seulement ; pas de KV sur disque, de cache partagé entre processus ou de prompt dans les diagnostics.
  token_state: Un vecteur de tokens effectivement évalués et une longueur de préfixe validée ; ne jamais confondre tokens émis et décodés.
  prepared_input: Un seul candidat de tokenisation par job, keyed par messages/options exacts ; le dernier count_input ne vaut pas automatiquement Generate.
  algorithm: |
    1. Valider scope, messages, template et budget complet avant de muter le contexte.
    2. Tokeniser le rendu exact, ou vérifier l'identité exacte d'un candidat préparé par ce même job.
    3. Calculer le plus long préfixe de tokens identiques avec le préfixe KV admissible ; aucun match sémantique.
    4. Borner reused à min(préfixe commun, longueur effectivement valide, input_tokens - 1).
    5. Retirer tout le suffixe KV à partir de reused, y compris les anciens tokens générés.
    6. Si clear_kv_cache_seq échoue ou retourne false, vider complètement, repartir de 0 et enregistrer le miss.
    7. Évaluer tokens[reused..] aux positions absolues ; recalculer au moins le dernier token pour obtenir des logits valides.
    8. Initialiser un nouveau sampler/état grammatical et décodeur UTF-8 ; aucun état de sampling de la requête précédente.
    9. Générer ; après succès, retirer la queue générée et conserver seulement le préfixe d'entrée vérifié comme candidat.
    10. Finalize après persistance réussie rend ce candidat réutilisable ; Abort ou absence d'acquittement le détruit.
  transactions: |
    Chaque appel LLM a son génération_id et sa finalisation après journalisation de son résultat/étape.
    Un parcours à plusieurs générations peut finaliser chaque étape acceptée, avant la suivante.
    Une erreur ultérieure du tour invalide le contexte avant le tour suivant, y compris après succès du runtime.
    Les sorties max_tokens, interrompues et non journalisées ne sont pas promues comme cache validé en première version.
  scope_boundaries: Changer propriétaire ou conversation impose clear_kv_cache complet avec données, pas seulement une suppression de suffixe.
  recurrent_models: La suppression partielle peut être impossible ; réutilisation désactivée tant que rollback/état récurrent n'est pas qualifié.
  equality_policy: Comparer les tokens exacts et le binding typé ; un hash facilite l'identification mais ne remplace pas cette vérification.
  isolation_limit: Effacer les buffers via l'API native ne constitue pas une garantie d'effacement physique de toute copie RAM/VRAM.

invalidation:
  full_reset:
    - Changement de profil, compte, institution, serveur, session ou conversation ; logout, suppression, chargement/reprise de session.
    - Rebind modifiant autorité/configuration pertinente, révocation ou variation des droits ; même propriétaire ne signifie pas mêmes autorisations.
    - Nouveau modèle/profil/tokenizer/template/format/raisonnement, budget ou paramètres du contexte ; mise à jour du moteur/backend.
    - Annulation, timeout, EOF, canal fermé, overflow, échec de journal, erreur de decode, grammaire ou callback.
    - Éviction explicite, erreur d'intégrité du cache, état natif incertain et sortie max_tokens.
  ordinary_changes: Nouvelle donnée pédagogique ou liste → nouveau rendu et nouveau préfixe exact ; ne jamais garder un fait ancien pour favoriser un hit.
  identical_rebind: Un rebind strictement identique ne change pas l'époque et ne vide pas le cache ; tester le chemin desktop réel qui rafraîchit une session connue entre tours.
  model_change: Détruire d'abord contexte puis ancien modèle ; vérifier le nouveau profil avant tout chargement, sans co-résidence de deux modèles.
  budget_failure: Erreur context_budget_exceeded, aucune génération ni preuve obligatoire tronquée ; ne pas confondre tokens réutilisés et place libre.
  native_failure: Marquer cache invalide avant de retourner ; recréer uniquement le contexte si récupération sûre, sinon arrêter le processus.
  rebind_order: Invalidation acquittée avant acknowledgement ACP du rebind ; aucun travail de l'ancienne époque accepté après celui-ci.
  admission_check: Revalider scope/époque à l'admission et à la finalisation ; un vieux Finalize ne réactive jamais un contexte révoqué.

prompt_layout:
  owner: LH-03/LH-06 produisent les messages ; runtime applique seulement le template réel et expose comptage/cache.
  stable_first: Rôle, règles pédagogiques et de provenance, version de format et descriptions métier durables utiles à ce chemin.
  dynamic_after: État pédagogique confirmé, sélection de capacités, preuves MCP, historique choisi, demande actuelle et préfixe assistant.
  excluded: Catalogue MCP exhaustif, credentials, horodatages techniques, UUID de trace et accusés du journal sans utilité pédagogique.
  evidence_identity: Références métier nécessaires et versions restent exactes ; le journal maintient l'audit complet hors prompt.
  determinism: Ordre des champs et des capacités stable ; pas de déplacement des consignes en données ou de suppression de provenance pour augmenter le cache.
  budgets: 2048/192/256 initialement ; tester 4096 séparément seulement après mesure, réserve explicite par mode et comptage du template inclus.

observability:
  status: TODO
  shared_contract: turn_observation de LH-00, consommé par LH-11 ; corrélation par identifiant éphémère sans texte privé.
  clocks: Instant monotone par processus ; transmettre des durées, pas soustraire des horloges arbitraires de processus différents.
  phases:
    - Admission/file du worker ; ouverture/stat du modèle, SHA-256, initialisation backend et allocation/chargement des poids séparés.
    - Rendu template et tokenisation, avec nombre d'appels dus à la projection ; distinguer ces appels de la tokenisation finale.
    - Allocation/recréation du contexte et du batch ; suppression de suffixe/cache, prefill, sampling/decode et conversion UTF-8.
    - Routage, connexion/catalogue MCP, permission humaine, appels MCP, persistance et attente d'émission ACP fournis par les lots propriétaires.
    - Première émission interne, premier texte visible ACP, premier rendu UI, première réponse utile et fin de réponse.
  counts: input_tokens total, reused_tokens, evaluated_input_tokens, output_tokens, generation_count, model_load_count et context_allocation_count.
  cache_fields: hit/miss/disabled, motif typé, longueur commune, tokens réellement réutilisés, invalidation et backend effectif.
  invariants: input_tokens = reused_tokens + evaluated_input_tokens après prefill intégralement réussi seulement ; progrès partiel inconnu reste null. Les appels de comptage ne consomment pas de tokens de génération.
  useful_response: |
    Profil/liste : première unité utile définie avant l'essai par l'oracle LH-11, rendue dans l'UI et cohérente avec la réponse finale.
    Un premier résultat seul ne termine pas une page ou une liste exhaustive demandée.
    Coaching : première proposition pédagogique répondant à la demande, validée par annotation de scénario/revue.
    Statut « je consulte », spinner, guillemet JSON ou étiquette interne ne comptent pas.
    Runtime fournit les événements techniques ; banc/UI et annotations qualifient l'utilité, sans prétendre la déduire d'un token seul.
    Une réponse fausse ou hors sujet conserve sa latence brute mais n'est pas un succès de réponse utile.
  human_time: Publier durée totale utilisateur et durée hors attente d'autorisation, ainsi que cette attente séparée ; aucun retrait silencieux.
  memory: RSS/working set et pic, mémoire dédiée GPU effectivement mesurable, mémoire libre au départ et placement des couches/buffers/KV.
  missing: Valeur absente/null avec motif si WDDM/backend ne fournit pas la mesure ; ne pas remplacer par la taille du fichier GGUF.
  privacy: Pas de messages, tokens bruts, chemins privés, arguments, secrets ou identifiants personnels dans les exports techniques par défaut.

compatibility:
  status: TODO
  engine_api: Adapter Engine via proxy ; ajouter des hooks internes à valeur par défaut pour scope/finalisation/observation sans casser les moteurs simulés.
  missing_hook: Réutilisation désactivée si le scope ou la finalisation n'est pas fourni ; aucun cache implicite fondé sur l'appel précédent.
  stats: Conserver GenerationStats(input_tokens, output_tokens, elapsed_ms, stop_reason) et les agrégations existantes.
  acp: Garder _meta.tutor.generation.inputTokens/outputTokens/elapsedMs et les stopReason existants ; extensions optionnelles versionnées.
  metadata_proposal: _meta.tutor.runtime avec schemaVersion=1 et phases/comptages ; nom final à figer avec turn_observation en LH-00.
  legacy_elapsed: elapsedMs ACP continue de représenter le tour ; nouveau runtimeElapsedMs distinct, sans changer subrepticement la métrique historique.
  logical_tokens: inputTokens reste le total logique, pas uniquement les nouveaux tokens de prefill ; sortie factuelle Rust garde 0 tokens LLM.
  aggregation: Identifier chaque génération interne et la réponse finale ; somme des durées de phase sans double comptage du temps total du tour.
  clients: Anciens lecteurs ignorent les extensions ; nouveaux lecteurs tolèrent leur absence et les erreurs/annulations sans statistiques complètes.

