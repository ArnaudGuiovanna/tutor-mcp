  - id: LH-10
    status: TODO
    depends_on: [LH-01, LH-09]
    changes: Binaries CPU/CUDA/Vulkan identifiés, backend réel observé et options d'offload bornées ; aucune optimisation activée sur score publié seul.
    cpu_first: Référence release mesurable avant GPU ; essais séquentiels de threads 2/4/6 et batch 32/64/128, sans changer tout simultanément.
    cuda: Chaîne <=12.9, CMAKE_CUDA_ARCHITECTURES=61 et version llama.cpp épinglée ; vérifier support des kernels et pilote Windows effectif.
    vulkan: Build, pilotes et opérations du modèle à qualifier séparément ; aucune présomption d'équivalence avec CUDA.
    gpu_selection: P2000 explicite, pas UHD 630 ; GPU demandé mais absent ou couches non offloadées → échec clair, pas résultat CPU étiqueté GPU.
    memory_target: Pic initial visé 3,2 Gio dédiés, ajusté à la VRAM libre mesurée ; poids + KV + buffers + coexistence Windows, pas taille GGUF seule.
    fallback: CPU explicite via profil/reprise du client, après arrêt de l'ancien worker ; tracer ce changement et réinitialiser le cache.
    acceptance: Rapport sur le PC cible secteur, pilotes/toolkit/build, couches placées, mémoire, qualité et stabilité thermique ; compilation seule insuffisante.

validation:
  status: TODO
  lightweight_tests:
    - Préfixes identiques, divergents au début/milieu/fin, prompt plus court, rendu identique et changement de tokens spéciaux.
    - Même préfixe texte mais un champ d'identité changé à la fois ; reused=0 pour profil/compte/institution/serveur/session/modèle/template.
    - Changement droits/rebind/budget ; Finalize et chunks d'ancienne époque ignorés ; aucune réactivation d'un cache invalidé.
    - Retrait partiel false/erreur, budget à la limite, preuve trop grande, prompt vide, grammaire erronée et allocation échouée.
    - Annulation avant chargement, pendant SHA/tokenisation/prefill/decode, durant backpressure et après émission avant Finalize.
    - Erreur de journal/emit/EOF, sortie max_tokens, timeout et shutdown ; requête suivante propre, sans texte ni suffixe du tour interrompu.
    - Deuxième génération refusée, file bornée, worker non réactif sans duplication ; destruction contexte avant modèle/backend.
    - Anciennes statistiques et moteurs simulés compatibles ; directe Rust sans chargement modèle ni tokens LLM ; données techniques sans secrets.
  live_cpu:
    - Test natif avec vrai GGUF release et tokenizer/template exacts ; un model_load_count, contexte réutilisé et prompt frais égal au comptage.
    - A/B cache off/on avec mêmes requêtes, seed et réglages ; contrôler contenu/parcours attendu et compteurs, pas seulement la vitesse.
    - Baseline et candidat après annulation/rebind/erreur ; cent tours séquentiels pour stabilité des allocations et absence de croissance continue.
    - Vrai ACP + Tutor local temporaire + UI pour première réponse utile ; essais sans MCP séparés, jamais présentés comme qualification intégrée.
  repeated_measurements: Au moins 30 répétitions par strate pour les microbenchmarks de développement ; séparer froid, chaud-hit, chaud-miss et invalidation. Les p95 d'acceptation LH-11 exigent les volumes supérieurs du paquet qualification.
  statistical_limit: Publier dispersion, intervalle d'incertitude et erreurs ; trente répétitions ne prouvent pas la stabilité de toute la population de requêtes.
  cancellation_target: Acquittement ACP visé sous 2 s sur PC cible, avec durée d'arrêt natif séparée ; dépasser cette borne reste un échec mesuré, pas une préemption supposée.
  parity: Comparer les attentes de scénario et la qualité entre cache off/on et backends ; tolérance numérique définie, pas promesse universelle de tokens identiques.
  targets_not_observations:
    warm_useful_response_p50_ms: 2000
    warm_useful_response_p95_ms: 4000
    decode_tokens_per_second: 15
    qualification: Cibles bout en bout LH-11 sur Windows cible, par parcours ; aucune garantie issue des trois paires exploratoires.
  stop_conditions: Fuite inter-propriétaires, succès inventé, coût caché, corruption KV, mémoire hors budget ou processus natif bloqué → NO_GO de la configuration.
  missing_hardware: INCOMPLETE sur Windows/P2000 jusqu'au retour du banc cible ; un succès CPU peut valider LH-01, jamais LH-10 matériel.

dependencies_and_open_questions:
  - LH-02 fournit les époques de connexion/droits ; les caches de catalogue et de KV ne partagent pas une autorisation implicite.
  - LH-03/LH-06 stabilisent la disposition du prompt et l'état pédagogique ; runtime ne résout ni intention ni référence métier.
  - LH-05/LH-11 possèdent corpus indépendant, annotation utile, revue pédagogique et exécution matérielle ; benchmarks lourds sérialisés.
  - L'intégrateur raccorde Finalize à la persistance et garantit invalidation en cas d'échec tardif du tour ; aucune sélection d'outil dans ce lot.
  - Déterminer support d'interruption native pendant un batch et borne réellement observée ; le polling entre batches ne préempte pas un kernel.
  - Vérifier rollback/cache pour chaque architecture hybride ou récurrente ; désactiver la réutilisation avant preuve, sans l'assimiler à un échec de qualité.
  - Choisir version du moteur et variantes de build à partir des tests de modèle et de sm_61 ; un upgrade peut changer API, kernels et templates.
  - Fixer durée d'inactivité avant éviction et stratégie mémoire après mesures ; première proposition sans LRU multi-session ni sauvegarde KV.

