    planned_paths: [client/local-agent/src/runtime.rs, client/local-agent/src/config.rs, client/local-agent/src/acp.rs, client/local-agent/src/harness.rs]
    ownership: Un agent propriétaire de runtime/config ; intégrateur seul propriétaire de acp.rs/harness.rs durant les adaptations concurrentes.
    acceptance: Tests d'isolation/erreur ci-dessous et rapport A/B réel ; un cache hit déclaré doit correspondre à un prefill effectivement réduit.
  - id: LH-09
    status: TODO
    depends_on: [LH-01, LH-04, LH-05]
    changes: Profils versionnés explicites, validation par architecture et couple binding/sys épinglé ; pas de simple assouplissement du garde Qwen actuel.
    profile_fields: Révision/SHA-256/licence, métadonnées GGUF, tokenizer/template, format d'outil, raisonnement, sampler, budget et capacité de cache.
    candidates: [Qwen3-1.7B de référence, LFM3-1.7B, Qwen3.5-2B, LFM2.5-2.6B]
    admission: Vérifier disponibilité et format exact de chaque candidat ; moteur insuffisant ou état récurrent non validé → INCOMPLETE.
