evaluation:
  status: TODO ; co-construction avec LH-05, exécution et rapport matériel dans LH-11.
  corpus:
    floor: Au moins 200 demandes et 50 dialogues indépendants selon le plan parent ; augmenter avant de conclure sur les catégories rares.
    split: Réserver entraînement, calibration et test ; groupes par scénario, famille de paraphrases, auteur/source et dialogue entier.
    leakage: Fautes, traductions et paraphrases d'un même cas restent ensemble ; huit cas de recherche connus uniquement comme régressions.
    calibration: Ajuster probabilités puis seuils de rejet sur sous-ensembles disjoints ou validation croisée interne ; aucun réglage sur le test final.
    independence: Référent qualification conserve le test tenu à part ; annotations relues, ambiguïtés et plusieurs réponses admissibles documentées.
    labels: Intentions, portée/négation, références/slots, sources requises, appels autorisés/interdits, clarification attendue et réussite de dialogue.
  ablations:
    routing: Routeur actuel, lexical seul, encodeur/classificateur, LLM borné, cascade ; capacités et protocole constants.
    state: Deux tours seuls contre état sourcé ; état sans/avec retrieval ; résumés secondaires activés/désactivés.
    context: Cache actif/inactif, 2048/4096, préfixe stable/variable ; même modèle/backend ; ne changer qu'un facteur à la fois.
    models: Réexécuter la stratégie retenue sur les profils LH-09 ; respecter template et tokenizer propres à chacun.
  metrics:
    quality: Exactitude des intentions/slots et réussite de dialogue, précision par classe, couverture automatique, rejets, faux appels et clarifications inutiles.
    rejection: Rapporter la courbe risque/couverture ; ne pas masquer un routeur inutile qui rejette presque tout derrière sa précision.
    latency: Chargement encodeur, routage, tokenisation, prefill, cache, MCP, premier texte utile et total ; froid/chaud séparés.
    resources: RAM, VRAM, tokens par section, extraits/omissions, nombre de générations et appels ; attente humaine explicitée.
    statistics: Effectifs et intervalles d'incertitude ; pas de p95 déduit de quelques essais ; aucune promesse de latence encodeur.
  acceptance_targets:
    semantic: Au moins 95 % de décisions/intention-parcours correctes sur test indépendant, clarifications jugées nécessaires incluses selon annotation préalable.
    useful_coverage: Rapport obligatoire des réponses utiles et rejets par catégorie ; seuil d'automatisation fixé avant test, sans changer l'objectif pour obtenir un GO.
    invariants: Zéro appel interdit, identité inventée, preuve requise altérée ou double mutation observé dans la suite ; cela ne prouve pas un risque universel nul.
    hardware: Cibles parent de 2 s médiane, 4 s p95 et 15 tokens/s à vérifier sur Windows/P2000 ; aucun résultat Linux ne les valide.
  required_tests:
    - Références « la deuxième », « on reprend », « je bloque » avec état valide, absent, périmé, liste partielle et deux listes concurrentes.
    - Négation, citation, explication sans consultation, demande composée conflictuelle et demande hors capacités disponibles.
    - Crash avant/après snapshot, réponse partielle, faux accusé d'affichage, migration, rétention et événement dupliqué/hors binding.
    - Changement de profil/tenant/serveur/conversation/modèle, droits révoqués et réponse MCP tardive après rebind.
    - Égalité des preuves requises avec originaux et compteur du GGUF réel aux deux budgets ; dépassement obligatoire explicitement refusé.
    - Serveur Tutor réel inchangé et ACP intégré pour le parcours complet ; doubles déterministes réservés aux invariants unitaires.

open_decisions:
  - Encodeur/classificateur, décision LLM ou cascade retenue après ablations ; artefacts et budget mémoire optionnel à approuver par mesure.
  - Accusé d'affichage et contrat de question pédagogique avec LH-07/LH-08 ; distinguer question conversationnelle et tentative serveur.
  - Granularité des snapshots, TTL et conflits de versions par source ; aucune expiration arbitraire ne remplace une revalidation nécessaire.
  - Seuil de couverture utile et volumes par catégorie à figer avec LH-05 avant ouverture du test indépendant.
  - Passage à 4096 et politique de cache/éviction décidés avec LH-01/LH-10 ; modèle et backend finaux restent hors de ce lot.
