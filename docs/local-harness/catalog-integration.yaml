version: 1
title: Catalogue MCP résident, hors contexte du modèle
date: '2026-11-02'
parent_plan: docs/plan-local-harness.yaml
source_base: ba93701b2144baaa545f724fe5cf95d94b335ecd
status: IN_PROGRESS
scope: Incrément LH-02 du client ACP Rust ; serveur Tutor inchangé, aucun nouvel installateur.
activation:
  flag: --catalog-cache on
  requires: --reuse-mcp on
  defaults: Les deux options restent off ; le profil distribué et le modèle ne changent pas.
  comparison: Même binaire, résidence MCP activée et cache de préfixe désactivé dans les deux variantes ; seul --catalog-cache diffère.

snapshot:
  storage: Entrées exactes et schémas conservés dans Rust ; aucun catalogue ajouté au prompt ou au KV du modèle.
  binding: Scope opaque existant, identité/configuration/conversation/session vérifiées et époque du Manager ; aucune deuxième identité ni référence fournie par le modèle.
  lifetime: Au plus 30 secondes, comptées avant la première page de tools/list ; le hit ne prolonge pas ce délai.
  acquisition: Snapshot paginé complet, borné et atomique ; notification concurrente, échec ou abandon interdisent tout repli sur une ancienne copie.
  stdio: Réutilisation seulement si listChanged annoncé, lecteur de notifications au repos observable, transport sain et portée/époque/révisions/TTL encore admissibles.
  http: Pas de cache entre lectures ; le transport actuel ne reçoit pas les notifications au repos. Rafraîchissement supplémentaire après une approbation avec cette option.
  invalidation: Changement de portée/époque, notification réelle, expiration, transport inutilisable, outil non revu ou erreur métier empêchent la réutilisation.
  counters: Révision des notifications réelles distincte du marqueur conservateur après tools/call ; débordement ferme/invalide au lieu de reboucler.
  reviewed_handlers: [get_learner_context, get_pending_alerts, get_olm_snapshot]
  reviewed_rule: Seul le marqueur du propre appel réussi peut être acquitté, avec forme du résultat contrôlée et sans changement de notification/époque/TTL ; ce mécanisme ne change aucun effet ni aucune permission.
  conservative_handlers: list_training_library, get_training et get_conversation_context ne sont pas exemptés ; leurs lectures peuvent initialiser une baseline de curriculum.

execution:
  authority: Le cache n'autorise aucun appel ; schéma exact, paramètres prouvés, permission ACP, garde de tour et exécuteur durable restent nécessaires.
  approval: Après la réponse allow correspondante, contrôler la fraîcheur ; les transports sans notifications observables imposent une nouvelle lecture réseau.
  dispatch: Dernier contrôle local avant IO ; échec de fraîcheur refuse l'appel sans rafraîchissement/rejeu automatique.
  uncertainty: Si l'exécuteur a déjà inscrit Dispatched, ce refus local peut conserver une issue Unknown conservatrice ; aucune réussite distante n'est inventée.
  scope_limits: L'empreinte couvre la configuration explicite, pas le remplacement d'un exécutable ou une modification d'environnement hérité ; le host doit invalider le Manager pour ces changements.

observations:
  path: result._meta.tutor.runtime.mcpConnection.catalog ; même extension sur les erreurs récoltées.
  fields: [schemaVersion, cacheHits, cacheMisses, lastMissReason]
  schema: Extension optionnelle version 1, compteurs bornés et motifs énumérés ; aucun schéma, outil, argument, secret ou identifiant de portée.
  timing: Un hit ne fabrique pas catalogTotalMs=0 ; durée non observée null et catalogAttempts=0. initializeTotalMs/catalogPages restent null dans le wrapper.
  distinction: Le relais compte séparément les pages sur le fil ; un appel wrapper n'est pas une page.

development_validation:
  unit: 239 tests sans moteur réussis, un essai Tutor explicite ignoré ; 248 tests natifs réussis, quatre essais explicites ignorés. Aucun succès attribué aux skips.
  static: Formatage et Clippy natif all-targets avec -D warnings réussis.
  python: 96 tests offline réussis, dont 23 contrôles du nouveau banc et 34 du qualificateur résident partagé.
  failures: Notification au repos/en pagination, expiration, changement de portée/génération, appel non revu/erreur, défaut de capacité, HTTP et schéma modifié pendant permission couverts par fixtures locales.
  actual_probe: client/scripts/qualify-local-catalog.py
  actual_report: docs/local-harness/catalog-development-baseline.json
  initial_report: docs/local-harness/catalog-probe-initial-sandbox-failure.json
  initial_outcome: Dans le bac à sable, initialize réussissait puis tools/list expirait à 30 secondes dans les deux variantes ; 32 contrôles réussis sur 71, huit cas manquants. Rapport conservé.
  rerun: Même code et mêmes binaires hors du bac à sable après autorisation ; 227 contrôles sur 227 réussis, dix demandes complètes. Ce changement d'environnement ne prouve pas la cause interne du blocage initial.
  fixture: Vrai Tutor local jetable et relais stdio transparent, deux conversations, permission contrôlée par le banc ; aucune authentification institution ni UI humaine.
  cases: [profil à froid, profil à chaud après rebind identique, refus, configuration différente, autre conversation]
  results: Trois initialisations et quatre appels de profil autorisés par variante ; cinq lectures de catalogue sans cache contre trois avec cache. Deux hits et aucun tools/list sur ces hits.
  durable: Reçus SQLite inspectés après arrêt, opération liée à la permission exacte et transitions attendues ; refus sans dispatch ni résultat, aucune projection modèle ni tentative de chargement/tokenisation/génération.
  shutdown: Les deux agents terminent sans arrêt forcé, EOF gracieux et code entier nul.
  timings: Premier texte du profil à chaud 275.86 ms sans cache contre 46.16 ms avec cache ; refus 257.29 contre 22.96 ms. Un point par cas, ordre fixe, relais inclus ; aucun p95 ni gain statistique.
  answer_oracle: Marqueur d'objectif synthétique et refus non vide seulement ; les reçus serveur ne qualifient pas toutes les assertions du rendu.
  reproducibility: Empreintes binaires/modèle et sources utilisées avant/après, paramètres et environnement inclus dans le JSON ; le hash préalable réchauffe le cache fichier.

remaining:
  - HTTP sans notifications au repos reste conservateur ; aucun gain de cache HTTP revendiqué.
  - Éviction inactive, diagnostics de connexion/nettoyage typés et campagne de fautes complète de LH-02.
  - État pédagogique et dernière liste réellement affichée, capacités métier puis routage des formulations libres ; ce cache ne résout pas la compréhension des intentions.
  - Corpus tenu à part, qualité du coaching, première réponse utile et fluidité dans l'UI.
  - Inférence et mémoire sur Windows/i7-9750H/P2000 4 Go ; aucun test GPU ni nouveau modèle dans cet incrément.
