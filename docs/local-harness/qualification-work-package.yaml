schema_version: 1
title: Qualification reproductible du harness Tutor local sur Windows et P2000
status: PLANNED
implementation_status: TODO
date: '2026-11-02'
owner: qualification
parent_plan: docs/plan-local-harness.yaml
parent_items: [LH-05, LH-11]
scope: Spécification du banc à implémenter ; aucun code produit ni résultat cible livré par ce document.
handoff: Revue et intégration par le principal ; aucune publication autonome.

existing_evidence:
  baseline:
    desktop: 0.0.8
    source_commit: e8185e5ebedddedd691bfd6adf4798e99ac9eb90
    release_tag: tutor-local-v0.1.0-alpha.4
    model_profile: client/local-agent/model-profile.json
    model: Qwen3-1.7B Q4_K_M
    sha256: b139949c5bd74937ad8ed8c8cf3d9ffb1e99c866c823204dc42c0d91fa181897
    bytes: 1107409472
    configuration: {context: 2048, max_output: 192, margin: 256, kv: f16, flash_attention: false, gpu_layers: 0}
    sampler: {temperature: 0.7, top_k: 20, top_p: 0.8, min_p: 0, seed: 42}
    behavior: Poids résidents, nouveau contexte par génération, deux tours projetés, routage par formulations, connexion MCP par parcours.
  inspected:
    - path: client/scripts/qualify-local-agent.py
      coverage: Vrai GGUF épinglé, calcul froid/chaud, premier texte, métadonnées agrégées, annulation et arrêt borné ; sans preuve P2000.
    - path: client/scripts/qualify-local-harness.py
      coverage: Vrai agent/GGUF, fixture HTTP trois outils, /alertes, permission et journal exact ; ni serveur Tutor réel ni catalogue complet.
    - path: client/scripts/qualify-local-context.py
      coverage: Vrai Tutor stdio temporaire et GGUF, huit scénarios profil/formation/refus ; coaching non qualifié, rapport avec textes synthétiques.
    - path: client/scripts/test_qualify_local_agent.py
      coverage: Faux processus, limites JSON/RPC, pins non remplaçables, non-divulgation, annulation et collecte des enfants ; aucune inférence qualifiée.
    - path: client/scripts/test_qualify_local_harness.py
      coverage: Refus sans appel, arguments prouvés, lectures et reçus exacts, budget, panne, arrêt ; GPU demandé distinct de GPU observé.
    - path: .github/workflows/client.yml
      coverage: Installateur, UI Automation, persistance et vrai Tutor/ACP ; accès GGUF et P2000 non testés par le reçu UI.
    - path: .github/workflows/local-agent.yml
      coverage: Compilation CPU Windows et fixtures ; reçus realModelInference et p2000Qualification explicitement not_tested.
    - path: client/local-agent/src/runtime.rs
      coverage: Deux tests GGUF ignorés en CI ; projection après cent tours et texte/grammaire/budget/annulation.
    - path: client/tests/frontend/TutorActivity.test.tsx
      coverage: Horloge simulée et statuts ; ne prouve ni animation WebView réelle ni délai de réponse utile.
    - path: client/docs/local-cpu-preview.md
      coverage: Limites 0.0.8 ; échec JSON arithmétique historique conservé, coaching imparfait, absence d'accélération P2000.
  research:
    source: docs/local-harness/research-baseline.json
    observed: Qwen 5/8 intentions ; préfixe réutilisé sur trois paires Linux CPU ; premier fragment médian 7,70 s contre 1,11 s.
    limitation: Exploratoire, pas de MCP, de corpus indépendant, de Windows ni de GPU ; jamais une preuve de latence produit.

contracts_and_scopes:
  dependencies:
    instrumentation_and_runtime: [LH-00, LH-01, LH-09, LH-10]
    mcp_and_capabilities: [LH-02, LH-04, LH-08]
    dialogue_and_routing: [LH-03, LH-06]
    acp_ui_integration: [LH-07]
  shared: [owner_binding, dialogue_snapshot, capability_proposal, admitted_execution, inference_request, turn_observation]
  ownership: LH-00 stabilise les champs avec qualification ; aucun agent qualification ne modifie seul runtime.rs, acp.rs ou harness.rs.
  evidence_levels:
    CI_PROTOCOL_UI: Fixtures, contrats, tests natifs sans GGUF et application installée ; aucun droit à déclarer une inférence réelle.
    LIVE_GGUF_FIXTURE: Vrai GGUF et agent, serveur MCP simulé ; pas de qualification du serveur Tutor réel.
    LIVE_TUTOR_GGUF: Vrai agent/GGUF et serveur Tutor inchangé, données jetables ; limite au matériel et transport exécutés.
    TARGET_WINDOWS_GPU: Client installé et vrai Tutor/GGUF sur i7/P2000 ; backend, placement et exécution effectivement observés.
  rule: Un succès inférieur ne remplit jamais un critère supérieur ; une dépendance absente donne INCOMPLETE, pas un test sauté réussi.

target_hardware:
  user_profile: Windows x64, un utilisateur, i7-9750H 6 cœurs/12 threads, 32 Go installés, Quadro P2000 4 Go.
  inventory: Relever Windows/build, CPU, RAM installée/utilisable, GPU/UUID local, VRAM totale/libre, pilote, alimentation, fréquences et température si exposées.
  selection: Sélectionner explicitement la Quadro ; UHD 630 ou adaptateur logiciel ne qualifient jamais la P2000.
  conditions: Secteur, même mode d'alimentation, aucune autre inférence ; enregistrer charge de fond, batterie, throttling et ordre des essais.
  backends:
    CPU: Binaire CPU, placement GPU nul vérifié ; threads 4 puis 6 sur développement, choix figé avant test.
    CUDA: Toolkit 12.9 épinglé, cible sm_61, compilateur et llama.cpp compatibles Pascal ; CUDA 13 exclu pour cette compilation.
    Vulkan: Pilote et runtime Vulkan épinglés, device P2000 et couches réellement placées vérifiés séparément.
  gpu_evidence: Inventaire + capacités du binaire + couches/buffers placés + inférence réelle ; utilisation/VRAM corroborantes, --gpu-layers seul insuffisant.
  memory:
    target_gib: 3.2
    effective_budget: min(3.2 Gio, VRAM libre avant lancement moins 0.5 Gio de réserve) ; enregistrer le calcul et le budget retenu.
    accounting: Poids, KV/état récurrent, buffers, WebView et routeur ; RSS/commit RAM, VRAM totale et variation, mémoire partagée et pics horodatés.
    sampling: 100 ms si disponible ; noter résolution et limites WDDM, ne pas inventer une mémoire par processus si non exposée.
    fallback: OOM ou repli CPU explicite, nouvelle cellule CPU ; aucun résultat de repli étiqueté CUDA/Vulkan réussi.
  duration: Test prolongé de 30 min sur le profil final ; relever dérive mémoire/latence et reprise après annulation.

model_matrix:
  status: TODO
  adoption: Aucune ; comparer d'abord le même Qwen/harness, puis les candidats sur le même harness gelé.
  variants: Q4_K_M obligatoire pour chaque candidat compatible ; Q5_K_M si budget réel suffisant, omission motivée dans le rapport.
  required_manifest: [model_id, repository, revision, gguf_sha256, bytes, quantization, license_spdx_or_text_sha256, notices, architecture, tokenizer_sha256, template_sha256, tool_format, reasoning_mode, sampler_order, sampler_values, seed, runtime_commit, binding_version, compiler, backend, context, output_limit, kv_or_recurrent_state]
  candidates:
    - model: Qwen3-1.7B
      role: Référence, profil exact existant ; comparer ancien moteur et moteur mis à niveau avant tout changement de modèle.
      source: https://huggingface.co/Qwen/Qwen3-1.7B
    - model: LFM3-1.7B
      role: Candidat récent, non qualifié.
      prerequisite: Support annoncé b11960/v0.8+ à rattacher aux dépôts/versions exacts ; pas une équivalence de numérotation présumée.
      risk: Désactivation du raisonnement incertaine ; mesurer tokens cachés et délai utile, cache récurrent, format outils et compatibilité sm_61.
      source: https://huggingface.co/LiquidAI/LFM3-1.7B
    - model: Qwen3.5-2B
      role: Candidat ; valider architecture et template avec le moteur retenu, texte seul sans composant vision inutile.
      risk: Vérifier le mode non-thinking effectif et les réglages texte spécifiques, distincts des réglages vision.
      source: https://huggingface.co/Qwen/Qwen3.5-2B
    - model: LFM2.5-2.6B
      role: Candidat ; template et format outils spécifiques, non évalué par les huit cas LFM2.5-1.2B historiques.
      risk: Fiche consultée annonçant raisonnement avant réponse ; mesurer ce coût et ne pas prétendre l'avoir désactivé.
      source: https://huggingface.co/LiquidAI/LFM2.5-2.6B
  admission: Licence, empreintes, format et runtime complets avant lancement ; sampler fournisseur adapté, jamais celui de Qwen copié par défaut.
  reasoning: Tokens de raisonnement exclus du texte utile mais inclus dans temps, budget et consommation ; troncature/max_tokens ne vaut pas succès.

instrumentation:
  status: TODO
  contract: Extension versionnée de turn_observation, métadonnées ACP historiques conservées ; champs absents null avec reason_code.
  event_fields: [schema_version, run_id, case_id, repetition, turn_id_local, span_id, parent_span_id, process_role, phase, start_monotonic_ns, duration_ns, outcome]
  clocks: Horloges monotones par processus ; horodatage UTC pour provenance seulement, corrélation IPC par IDs sans soustraction d'horloges non synchronisées.
  phase_spans:
    artifact_hash: SHA du banc et SHA du chargeur distincts ; lecture complète des poids réchauffant le cache OS signalée.
    model_load: Initialisation backend, lecture/mmap/transfert poids ; compteur load_count et durée séparés du hash.
    template_and_count: Template, tokenisation, nombre d'appels au compteur et coût cumulé de la projection ; aucun coût caché dans prefill.
    context_allocation: Création/restauration, éviction, KV/état récurrent et buffers ; allocations réelles distinguées des réutilisations.
    prefill: Tokens soumis, nouveaux/réutilisés, durée des évaluations prompt ; synchronisation GPU et méthode de mesure documentées.
    decode: Temps par génération, tokens produits/visibles/cachés, premier token interne, intertokens et raison d'arrêt.
    router: Recherche/encodeur/classifieur, candidats, rejet, décision LLM et coût de chaque passage ; mémoire du routeur comprise.
    mcp: Connexion, initialize, catalogue/pagination, auth, admission, validation, appel, réception et sélection du résultat, retries observés.
    human: Permission affichée puis réponse ; auth interactive et pauses de revue, unions d'intervalles sans double comptage.
    ui: Envoi utilisateur, IPC, premier statut, première peinture de texte, première unité utile et fin affichée dans le client installé.
  tokens_per_second: (output_tokens - 1) / secondes entre premier et dernier token pour au moins 32 tokens ; sinon null/too_short.
  throughput: Rapporter séparément tokens utiles et tous tokens dont raisonnement ; ne pas comparer les tokenizers comme mesure de qualité.
  useful_response:
    start: Action Envoyer dans l'UI ; également mesurer le sous-parcours ACP depuis session/prompt.
    stop: Première unité visible satisfaisant l'oracle du cas et maintenue correcte dans la réponse finale.
    oracles: Profil avec champs requis sourcés ; page de formations correcte et complète demandée ; première explication/action pédagogique pertinente revue.
    exclusions: Statut, formule d'attente, nom de route, JSON interne, raisonnement, fragment inintelligible ou refus non justifié.
    coaching_timestamp: Revue humaine de la transcription synthétique alignée aux chunks ; absence de revue donne INCOMPLETE pour cette métrique.
    measures: wall_ms inclut tout ; system_ms retire seulement l'union des attentes humaines ; les deux restent publiés, avec automated_permission séparée.
  observer_cost: Comparer traces activées/désactivées sur développement ; surcoût et synchronisation GPU rapportés sans soustraction opportuniste des mesures.

cache_protocol:
  dimensions: [os_file_cache, process_model_residency, inference_prefix_or_recurrent_state, router_index, mcp_connection_catalog, verified_business_data]
  cold_process: Nouveau processus, aucun modèle/contexte/transport résident ; état du cache fichier OS consigné indépendamment.
  cold_os: Seulement après redémarrage contrôlé et preuve disponible ; sinon unknown, jamais froid déduit d'un nouveau processus.
  warm: Processus et modèle confirmés résidents, amorçage hors mesures identifié ; warm ne signifie pas prefix_hit.
  hit: Compteur réel de tokens réutilisés et préfixe admissible identique ; pour état récurrent, checkpoint et restauration correcte prouvés.
  miss: Zéro réutilisation ou invalidation vérifiée ; changer préfixe, version/faits, template, budget, modèle et binding avec motifs distincts.
  control: Même requête et état avec cache désactivé ; pas de catalogue complet ni UUID aléatoire injecté au préfixe stable.
  isolation: A→B→A, comptes/tenants/serveurs/conversations distincts et marqueurs synthétiques uniques ; vérifier sortie, état, appels, journal et exports.
  invalidation: Changement droits/auth, sélection/version, serveur, modèle/template/runtime ; aucune donnée personnelle de A visible à B même à cache chaud.
  transport: Deux tours prouvent une seule initialisation admissible ; reconnect/catalog_changed et données périmées ne réutilisent pas une autorité ancienne.

held_out_corpus:
  status: TODO
  split: Entraînement, développement/calibration et test séparés par famille/scénario ; proches paraphrases et fautes restent dans le même split.
  independence: Rédaction et double annotation hors équipe de réglage ; 200 demandes FR inédites + 50 dialogues, sans les huit cas de recherche ni exemples déjà corrigés.
  singles_by_primary_family:
    profil_et_faits: 25
    listes_formations_et_pagination: 25
    formation_active_et_absence: 20
    selection_et_references: 15
    reprise_indice_et_blocage: 20
    aide_et_capacites: 20
    explication_pedagogique: 30
    negation_citation_et_non_action: 25
    multiintent: 20
  dialogues_by_primary_family: {liste_pagination_selection: 8, reprise_contexte: 8, negation_correction: 8, multiintent: 8, progression_sourcage: 8, refus: 5, isolation_rebind: 5}
  dialogue_length: 4 à 10 tours annotés, plus scénarios de cent tours dédiés au budget/restauration.
  cross_tags: Fautes ≥40 demandes/15 dialogues ; négation ≥25/8 ; références ≥30/20 ; multiintent ≥20/8 ; tags chevauchants.
  fixture_states: Profil absent/partiel/complet, aucune formation/une/plusieurs, listes multi-pages et vides, sélection périmée, permissions différentes.
  case_fields: [id, family_id, split, tags, synthetic_fixture_seed, initial_state_refs, messages, expected_intents, expected_entities_or_references, preconditions, allowed_effects, forbidden_effects, expected_clarification, useful_unit_oracle, final_facts, rubric_version]
  oracle: Plusieurs réponses acceptables préannotées si ambiguïté réelle ; clarifier sans nécessité est une erreur sur demande non ambiguë.
  strict_success: Toutes intentions et références correctes, bon périmètre, effets nécessaires réalisés, faits exacts, aucun effet interdit ; multiintent partiel échoue.
  honesty: Absence/refus/erreur distincts ; aucun niveau, progrès ou enregistrement annoncé sans preuve serveur correspondante.
  lock: Empreintes du corpus/oracles et revue avant réglage ; accès test après gel des profils ; réutilisation pour réglage impose un nouveau test indépendant.

execution_and_statistics:
  status: TODO
  order: Manifeste/fixtures figés, autodiagnostic puis screening développement, ablations, gel, test indépendant et client installé.
  repetitions: Cinq répétitions seed 42 par variante/cas de latence ; sensibilité qualité seeds 42/43/44 séparée, sans retenir le meilleur tirage.
  reproducibility: Ordre pseudo-aléatoire seed 20261102, blocs appariés alternés, une génération active ; corpus initial identique et reset par cas, état conservé dans un dialogue.
  quantiles: Trier sans arrondi ; p50 médiane (moyenne des deux valeurs centrales si n pair), p95 au rang ceil(0.95*n) ; arrondi à l'export seulement, formule et n explicites.
  statistical_unit: 200 demandes et 50 dialogues indépendants ; répétitions non comptées comme nouveaux exemples de compréhension.
  cohorts: Lecture MCP, pédagogie générée, ambiguïté/repli ; cache hit/miss et transport froid/chaud séparés, sans cacher la génération derrière les rendus directs.
  sample_minimum: Pour chaque p95 d'acceptation, ≥100 observations et ≥20 cas distincts par cohorte ; sinon INCOMPLETE même si le nombre est descriptif.
  quality: Accuracy stricte principale sur 200 cas au premier passage seed 42, matrice de confusion et scores par catégorie ; stabilité et autres seeds séparés.
  dialogues: Réussite par tour et dialogue complet ; cible proposée ≥95 % des tours et ≥90 % des dialogues, avec zéro progression inventée.
  failure_policy: Timeouts, erreurs, refus indus et réponses inutiles restent au dénominateur ; latence utile censurée à +inf pour décision, JSON null avec motif.
  refusal_metrics: Rappel des refus attendus, faux refus et appels non autorisés ; ne pas optimiser la latence en refusant les demandes valides.
  stability: Source, binaire, pilote, options et charge tracés ; seed fixe ne promet pas identité bit à bit entre backends.
  cold_samples: Cinq démarrages par finaliste, mesures descriptives de chargement/hash ; pas de p95 d'acceptation sur cinq points.
  human_coaching: Deux relecteurs en aveugle sur les 50 dialogues, désaccords arbitrés ; noter exactitude, adaptation, aide graduée et question utile de 0 à 4.
  coaching_gate: Cible proposée ≥90 % des dialogues avec chaque dimension ≥3/4, zéro progression inventée et zéro correction majeure fausse non signalée.
  replay: Recalcul offline des scores depuis JSONL immuable et annotations ; résultats identiques, sans relancer le modèle ni réinterpréter les seuils.

ablations:
  fixed: Même matériel, GGUF, sampler, contexte, état et corpus ; une variable à la fois, puis interactions explicites.
  stages:
    - {id: A0, change: '0.0.8 originale, ancien runtime Qwen CPU', evidence: 'Binaire/SHA exact ; phases absentes INCOMPLETE, aucun score reconstruit.'}
    - {id: A1, change: 'Instrumentation seule LH-00', evidence: 'Comportement inchangé et surcoût mesuré ; SHA distinct de A0.'}
    - {id: A2, change: 'Worker/cache LH-01 off/on', evidence: 'Modèle chaud, hit/miss et invalidations, tokens réellement réutilisés.'}
    - {id: A3, change: 'Connexion/catalogue LH-02 par tour/persistant', evidence: 'initialize/list/call et fraîcheur, qualité identique.'}
    - {id: A4, change: 'État LH-03 et capacités LH-04', evidence: 'Ancien historique puis état compact ; capacités constantes pour isoler la projection.'}
    - {id: A5, change: 'Routeur LH-06', evidence: 'LLM court vs encodeur/classificateur CPU vs cascade ; mêmes capacités, coût de tous replis.'}
    - {id: A6, change: 'Intégration LH-07/08', evidence: 'Parcours ACP et boucle pédagogique, rendus directs et synthèses comptés.'}
    - {id: A7, change: 'Runtime puis modèles LH-09', evidence: 'Qwen ancien/nouveau runtime d’abord ; candidats ensuite, état récurrent et raisonnement compris.'}
    - {id: A8, change: 'CPU/CUDA12.9sm61/Vulkan LH-10', evidence: 'Même PC/configuration, Q4 puis Q5 admissible, contexte 2048 puis 4096 séparé.'}
    - {id: A9, change: 'Profil final LH-11', evidence: 'Corpus indépendant complet, vraies couches serveur/client installé, tenue 30 min et revue humaine.'}
  screening: Développement distinct pour éliminer incompatibilités et figer finalistes ; pas de produit cartésien coûteux ni de réglage sur le test final.

fault_campaign:
  status: TODO
  scenarios:
    - Refus ACP avant envoi et révocation après cache chaud ; aucun appel, reçu, fait privé ou faux succès.
    - Annulation pendant hash, count, allocation, prefill, decode, permission, appel MCP et rendu ; prochaine requête propre, enfants collectés.
    - Auth expirée/401/403, changement de compte, reconnexion HTTP/stdio, EOF et catalogue modifié ; invalidation, pas de rejeu aveugle.
    - Panne après envoi d'une écriture synthétique ; issue inconnue conservée, réconciliation/idempotence, aucun double progrès.
    - Pagination avec doublons, curseur expiré, page vide et limite ; aucune formation omise/dupliquée ni numéro transformé en ID inventé.
    - Deux comptes aux marqueurs distincts, changement de conversation et retour au premier ; zéro pollution cache/état/journal.
    - Injection d'instructions dans résultat MCP, payload énorme, schéma incompatible, budget plein ; faits requis non tronqués, erreur explicite.
  transports: Fixture HTTP pour fautes déterministes ; vrai Tutor local pour parcours ; auth HTTP sur instance de test dédiée si disponible, sinon INCOMPLETE pour ce critère.
  isolation: Données jetables et compte Windows de test ; aucun accès à l'institution réelle ni modification du serveur MCP.

windows_package:
  status: TODO
  proposed_artifacts: [TutorBench.exe, run-benchmark.cmd, manifests, schemas, corpus_synthetique, runtime_CPU, runtime_CUDA_sm61, runtime_Vulkan, serveur_Tutor, notices, SHA256SUMS]
  entrypoint: Double-clic run-benchmark.cmd ; chemins avec espaces/accents acceptés, pas de Python/compilateur à installer chez l'utilisateur.
  input: Choisir GGUF déjà présent et dossier rapport neuf ; manifeste exact, hash en streaming, aucun téléchargement implicite ni remplacement du modèle installé.
  isolation: Profil et serveur temporaires ; client installé lancé avec profil de test prévu par LH-07, jamais déplacer/renommer les données utilisateur existantes.
  operation: Afficher phase et estimation issue du smoke local, arrêt disponible ; verrou de campagne, checkpoint atomique, reprise des cellules manquantes à identité égale.
  export: Rapport JSON/CSV/HTML autonome et ZIP vérifiable ; succès/échec/interruption conservent les preuves acquises, pas les secrets ni transcriptions réelles.
  proposed_cli_after_implementation:
    - '.\TutorBench.exe inspect --output .\rapport-neuf'
    - '.\TutorBench.exe run --manifest .\manifests\final.json --model "C:\Modeles\modele.gguf" --suite qualification --output .\campagne-neuve'
    - '.\TutorBench.exe resume --campaign .\campagne-neuve'
    - '.\TutorBench.exe report --campaign .\campagne-neuve --export .\rapport.zip'
  availability: Ces commandes sont des contrats à implémenter ; seuls les trois qualify-local-*.py existent aujourd'hui, avec leurs limites décrites ci-dessus.

result_formats:
  status: TODO
  files:
    manifest_json: Versions/SHA des sources, binaires, GGUF, schémas, corpus/oracles, profils et licence ; inventaire pseudonymisé et paramètres complets.
    observations_jsonl: Une ligne par tour/répétition et spans corrélés ; intent attendu/observé, oracle utile, caches, tokens, durées, mémoire, effets et motif d'échec.
    criteria_json: Un objet par critère avec scope, statut GO/NO_GO/INCOMPLETE, cible, valeur/null, unité, dénominateur, preuves/SHA et missing_reason.
    summary_csv_html: Vue par modèle/backend/ablation/cache/cohorte, p50/p95, exactitude/refus, coaching et limites ; aucun voyant global masquant un manque GPU.
    synthetic_review_jsonl: Réponses synthétiques seulement, chunks horodatés et annotations humaines ; export séparé, jamais profil/transcription utilisateur réelle.
  immutability: JSON strict sans NaN/Infinity, UTF-8, schémas versionnés, clés inconnues rejetées, JSONL append-only, rapport final atomique sans écrasement d'entrée.
  provenance: Chaque résumé référence les observations et reçus exacts ; un champ déclaré par l'agent seul n'atteste pas indépendamment son exécution.

decision_gates:
  status: TODO
  targets_are_not_measurements: true
  criteria:
    - {id: intent, target: '≥95 % sur 200 demandes tenues à part ; toutes intentions/requêtes composées satisfaites', scope: LIVE_TUTOR_GGUF}
    - {id: dialogue, target: '≥95 % tours et ≥90 % dialogues complets ; références exactes', scope: LIVE_TUTOR_GGUF}
    - {id: facts_permissions_isolation, target: 'Zéro fait/progrès inventé, appel interdit, divulgation intercompte ou double écriture', scope: LIVE_TUTOR_GGUF}
    - {id: latency, target: 'Réponse UTILE à chaud system p50 ≤2 s et p95 ≤4 s, par cohorte et hit/miss ; wall et attente humaine publiés', scope: TARGET_WINDOWS_GPU}
    - {id: decode, target: 'p50 ≥15 tokens/s visés sur générations éligibles, p5 publié ; pas de débit attribué aux rendus Rust', scope: TARGET_WINDOWS_GPU}
    - {id: memory, target: 'Pic VRAM dans budget ajusté ≤3.2 Gio, sans OOM/repli caché ; RAM et mémoire partagée publiées', scope: TARGET_WINDOWS_GPU}
    - {id: coaching, target: 'Revue humaine selon coaching_gate ; aucun score automatique seul', scope: LIVE_TUTOR_GGUF}
    - {id: lifecycle_ui, target: 'Refus, annulation ≤2 s après demande sur phases locales, reconnexion, flux/animation/réduction mouvement et reprise vérifiés', scope: TARGET_WINDOWS_GPU}
  deterministic_rules:
    GO: Toutes preuves requises présentes, échantillons suffisants et cibles satisfaites pour le critère et la configuration nommés.
    NO_GO: Preuve d'échec ou cible ratée ; une erreur connue reste NO_GO même si d'autres preuves manquent.
    INCOMPLETE: Preuve, mesure, matériel, annotation, licence ou taille d'échantillon manquante ; null n'est jamais remplacé par zéro.
  overall: NO_GO si un critère obligatoire échoue, sinon INCOMPLETE si un manque, sinon GO ; aucun GO global matériel sans vraie P2000 et client installé.
  backend_policy: Candidats incompatibles/finalistes rejetés restent visibles ; seul le profil explicitement retenu peut recevoir GO produit, sans effacer les autres cellules.

