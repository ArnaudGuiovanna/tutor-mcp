observations_scope: Constats historiques au baseline_commit ; voir resident-integration.yaml pour l'incrément de connexion suivant.
observations:
  - source: client/local-agent/src/harness.rs:59
    fact: ACP utilise fast_harness ; run_fixed ouvre et ferme un Client par tour, initial_state crée un binding aléatoire et un catalogue neuf.
  - source: client/local-agent/src/mcp_client.rs:37
    fact: Transport sérialise les appels ; les erreurs HTTP/stdio sont réduites à Connection/Catalog/Call, sans phase d'envoi ni statut HTTP exploitable.
  - source: client/local-agent/src/mcp.rs:205
    fact: HTTP ne lit les notifications que dans les réponses POST/SSE, sans flux GET au repos ; chaque tools/call marque le catalogue sale.
  - source: client/local-agent/src/mcp_stdio.rs:235
    fact: Stdio a un superviseur résident, notifications au repos, une requête en vol et nettoyage du groupe/job ; annulation ou future abandonnée ferme le transport.
  - source: client/local-agent/src/harness.rs:1250
    fact: Le pilote refuse toute mutation ; deux outils distincts maximum et aucun second appel au même outil empêchent la pagination métier.
  - source: client/local-agent/src/call_validation.rs:222
    fact: Les effets sont une liste revue, indépendante de readOnlyHint ; list_training_library/get_training/select_conversation_training ne sont pas admis.
  - source: client/local-agent/src/executor.rs:448
    fact: Préparation durable, permission ACP et garde précèdent Dispatched ; échec après dispatch ou erreur métier de mutation mène à Unknown, sans renvoi automatique.
  - source: client/local-agent/src/pedagogical.rs:4
    fact: Machine dormante de reçus jusqu'à DecisionConfirmed/Terminal ; elle ne valide ni exercice généré ni évaluation et ne fait aucun dispatch.
  - source: client/src-tauri/src/backend.rs:1863
    fact: Chaque envoi relit overview puis get_conversation_context côté desktop ; HostContext natif ne reçoit que langue, conversation et formation, pas les rôles.
  - source: client/src-tauri/src/backend.rs:1405
    fact: Le desktop possède déjà un RPC stdio pour son aperçu ; celui du harness est un second processus, à mesurer et isoler explicitement.
  - source: db/training.go:38
    fact: Des lectures training peuvent créer la baseline immuable d'un ancien domaine ; TrainingReadAction ne garantit pas une absence physique d'écriture.
  - source: tools/training.go:72
    fact: Schéma TrainingRequest partagé ; sélection exige id, expected_selection et arguments.key ; conversation liée par header/env, droits contrôlés au serveur.

invariants:
  - Le serveur et ses schémas, droits, règles pédagogiques et contrats d'idempotence ne seront jamais modifiés par ces lots.
  - Catalogue complet et schémas restent dans Rust ; seules quelques capacités pertinentes et des faits sélectionnés peuvent entrer dans le prompt.
  - Une proposition sémantique, un rôle administratif, can_learn ou readOnlyHint ne constituent jamais une permission d'exécution.
  - Chaque outil métier réel conserve allow/ask/deny ACP, validation de schéma, preuves des paramètres et restrictions Tutor-Tool-Policy applicables.
  - Après dispatch, annulation/timeout/décès n'annulent pas l'effet distant ; aucune mutation Unknown n'est rejouée, même avec sa clé initiale.
  - Une lecture de l'état actuel peut montrer un état confirmé sans prouver quelle opération inconnue l'a produit ; ne pas effacer Unknown par inférence.
  - Les références exactes et résultats complets restent au journal ; les projections ne fabriquent ni identité, version, progression ni maîtrise.

resident_connection:
  binding_key: Owner vérifié existant + identité/configuration serveur + UUID conversation + session ACP ; jamais le seul nom tutor.
  owner: Réutiliser session_store::Owner et local_journal_owner ; compte/tenant/appartenance vérifiés, distincts du renouvellement du bearer.
  epochs: Séparer transport_generation, authorization_epoch et catalog_generation ; une réponse tardive n'actualise jamais une génération plus récente.
  configuration: URL/commande/cwd/args/env/header de conversation fournis par le host uniquement ; empreinte privée, aucun secret dans journal exporté ou prompt.
  ownership: Acteur asynchrone par binding, propriétaire du Client et du catalogue ; un appel en vol, file bornée et annulation par requête.
  residency: Conserver au moins la connexion active entre tours ; borne proposée d'une connexion inactive, éviction après 5 min configurable et à mesurer.
  admission: Le tour réclame un lease de génération ; aucun verrou global de journal tenu pendant permission UI, attente de connexion ou file d'acteur.
  transitions:
    connect: Absent → Connecting → Ready après initialize/initialized et snapshot tools/list complet ; échec → Unavailable sans faits supposés.
    same_binding: Réutiliser Ready si configuration et autorité identiques ; aucun nouveau handshake ni nouveau processus simplement parce qu'un tour commence.
    rebind: _tutor/rebind reste sans replay et refusé pendant opération active ; un rebind identique est sans effet, un changement révoque leases/propositions avant fermeture.
    owner_or_server_change: Refuser le rebind d'une session vers un autre Owner ; nouveau binding, aucun transfert de preuves, listes, permissions ou journal d'un compte à l'autre.
    conversation_change: Ne pas réutiliser une session HTTP ou un enfant stdio lié à un autre header/env de conversation ; sélections et résultats restent isolés.
    auth_refresh: Desktop renouvelle l'accès puis transmet une nouvelle configuration au repos ; même Owner, nouvelle génération transport/autorisation et catalogue revalidé, journal préservé.
    auth_failure: Exposer 401/403/expiration sous code interne expurgé ; suspendre, notifier le host, ne jamais demander ni fabriquer un token via le modèle.
    death: EOF/enfant mort/session HTTP périmée/protocole invalide → Unavailable ; terminer l'appel une fois, conserver son reçu ou Unknown et nettoyer avant reconnexion.
    cancellation: Avant dispatch, rejeter Prepared sans appel ; après dispatch, conserver Completed reçu ou Unknown ; ne pas transférer le booléen annulé au tour suivant.
    reconnect: Rétablir le canal pour une nouvelle demande explicite ou une lecture admise, sans renvoyer l'opération précédente ni redémarrage en boucle.
    shutdown: Déconnexion, logout, éviction et EOF ACP ferment les leases ; stdio attend le nettoyage groupe/job, HTTP conserve sa fermeture locale sans DELETE métier ajouté.
  catalog:
    acquisition: Snapshot tools/list paginé atomique, bornes/cursors/doublons existants ; génération sale pendant acquisition → rejet de l'ensemble, pas de catalogue partiel.
    invalidation: list_changed, auth/policy/rebind, reconnexion ou visibilité incertaine bloquent l'admission sur l'ancien snapshot.
    race: Invalider aussi les appels approuvés non dispatchés ; revalider arguments et schéma, redemander permission si contrat ou paramètres changent.
    stdio: Conserver le lecteur de notifications et révision monotone au repos ; vérifier qu'une notification concurrente au dernier tools/list n'est pas perdue.
    http: Pas de promesse de notification au repos avec le code actuel ; GET de notifications seulement si serveur inchangé compatible, sinon rafraîchissement borné par temps/tour.
    conservative_default: Garder initialement l'invalidation après tools/call ; son retrait partiel exige revue de visibilité, tests de révocation et politique de fraîcheur explicite.
    optimization_candidate: Séparer schémas/candidats en cache et autorité toujours contrôlée ; tester un TTL maximal de 30 s, rafraîchissement forcé sur tout événement connu.
    expiry: TTL éventuel ne prolonge jamais une permission, un accès serveur ou un appel préparé ; snapshot périmé interdit à l'admission.
    budget: Quelques résumés de capacités seulement pour LH-06 ; zéro catalogue complet dans l'entrée tokenizer, y compris aux étapes de repli.

interfaces_proposees:
  status: TODO ; consolider avec owner_binding, dialogue_snapshot, capability_proposal, admitted_execution et turn_observation du plan principal.
  ResidentMcpManager: acquire(OwnerBinding, HostConfig) → ConnectionLease ; invalidate(reason), rebind(config), close(scope) ; pas d'API accessible au modèle.
  ConnectionLease: Transport existant + générations + catalogue vérifié ; identifiants de requêtes propres au canal et nouvelle vérification juste avant dispatch.
  CapabilityRegistry: resolve(CapabilityProposal, DialogueSnapshot, CatalogSnapshot) → AdmittedExecution ou Clarification/Unavailable/Denied ; jamais exécuter directement une chaîne LLM.
  AdmittedExecution: Étapes typées, sources ContentRef, effets revus, schémas exacts, limites d'appel/temps/octets, permissions et condition d'arrêt.
  CapabilityReceipt: Résultats intacts + sélections JSON exactes + binding/générations/heure d'observation ; états absent/inconnu/périmé/refusé/erreur distincts.
  ChoiceSet: Référence de l'affichage réellement livré, numéro→ID/révision/ContentRef, query/filter/after et ordre ; détenu par LH-03, jamais recréé depuis un résumé.
  HostFacts: Extension versionnée et optionnelle du canal HostContext pour identité/rôles vérifiés, avec source/auth_epoch/observation ; validation stricte et compatibilité anciens clients.
  permits: Étendre l'exécuteur avec autorité typée de consultation/sélection ; ne pas fabriquer un pedagogical_precondition ni une phase pédagogique pour autoriser la bibliothèque.
  durable_io: Préserver contrat immuable → Prepared → permission → garde/epochs → Dispatched → Completed/Unknown ; si refactor de verrou, conserver l'atomicité durable avant IO.
  errors: Ajouter catégorie/phase d'envoi et statut HTTP interne ; conserver Unknown conservateur si l'envoi ne peut être exclu, et ne pas classifier une erreur métier en succès.
  observation: Horodatages monotones par phase sans arguments privés ; mêmes corrélations LH-00/LH-11, attente humaine et première réponse utile séparées.

effect_contracts:
  business_read: get_learner_context/get_pending_alerts/get_olm_snapshot ; contrats revus, toujours permission métier et pas d'exemption fondée sur annotation.
  read_with_possible_writes: list_training_library/get_training/get_conversation_context/get_curriculum_snapshot ; revue handlers/store requise, conservateurs sans rejeu automatique.
  historical_mutation: start_learning_session/get_next_activity/init_domain utilisent le middleware params._meta.idempotency_key pour les outils qui y figurent réellement.
  training_mutation: select_conversation_training utilise arguments.key stable 1..128, reçu training côté serveur ; ajouter un effet distinct, pas MiddlewareKey par analogie.
  protected_fields: id/domain_id/training_id/conversation_id/concept/revision/expected_selection/key sont fournis ou résolus par Rust depuis les preuves correspondantes.
  selection_conflict: Le serveur recommande relecture et clé fraîche ; l'exécuteur actuel marque l'erreur de mutation Unknown, donc aucun retry caché avant classification/réconciliation revue.
  unsupported: Outil absent, contrat inconnu ou schéma incompatible → indisponibilité explicite ; aucun contournement par endpoint desktop ou dispatch générique.

capability_registry:
  profile.read:
    status: TODO
    preconditions: Owner/learner vérifiés ; aucun domaine requis pour consulter son profil ; respecter les refus de chaque source.
    reads: [get_learner_context, get_conversation_context]
    mutations: Aucune intentionnelle ; get_conversation_context peut initialiser une baseline via la lecture de formation.
    order: Contexte apprenant → contexte conversation seulement si nécessaire ; réutiliser une preuve host fraîche et liée plutôt que dupliquer la lecture. Les alertes restent un parcours distinct et ne bloquent pas cette consultation personnelle.
    project: Objective, profile.device/language/affect_baseline, domaines/concept_count, archives distinctes, last_session, interactions_today, formation active et sources/observations.
    composition: Rôles depuis overview.identity.roles vérifié via HostFacts seulement ; bibliothèque paginée via training.search pour compléter les formations accessibles si demandées.
    unknowns: Une chaîne vide confirmée vaut non renseigné ; source manquante/refusée vaut inconnu/refusé ; langues UI et préférence déclarée restent distinctes.
    forbidden: Inférer un rôle depuis learner_id ou les droits ; assimiler propriétaire à expert, concept_count/priority_retention à maîtrise ou dernier domaine à formation sélectionnée.
    qualification: Profil sans domaine, profil partiel, rôle owner+learner mais aucune preuve de niveau, refus d'une source, erreur et grande liste conservée hors prompt.
  training.search:
    status: TODO
    preconditions: list_training_library présent et admis par politique réelle ; query/filter proviennent du besoin, jamais d'un ID imaginé.
    reads: [list_training_library]
    mutations: Aucune intentionnelle ; lecture d'un domaine ancien susceptible d'initialiser la baseline.
    order: Première page query/filter/limit → items rendus → mémoriser ChoiceSet livré → page suivante après demande ; conserver next_after exact.
    pagination: Arguments after/limit, résultat items/next_after ; distinct de tools/list cursor/nextCursor ; limite serveur 1..100, défaut 20, UI initiale proposée 10.
    filters: Valeurs réelles vide/personal/institutional/shared/mine/review/archived ; filtre explicite, pas de confusion entre formations accessibles et formation active.
    project: Ordre/numéro, name, kind, status et possibilités pertinentes ; ID/révision et can_* exacts gardés côté harness avec preuve ; nom échappé à l'affichage.
    forbidden: Créer/sélectionner/rejoindre pendant une recherche ; annoncer une liste exhaustive si next_after existe ; confondre vide avec refus ou oublier une page échouée.
    qualification: Deux pages réelles, doublons/noms homonymes, absence de résultat, changement de requête, résultat partiel et contrôle des droits avant tout choix ultérieur.
  training.active:
    status: TODO
    preconditions: UUID conversation host vérifié, même Owner/serveur ; champ sélection inconnu distinct de contexte confirmé sans formation.
    reads: [get_conversation_context, get_training]
    mutations: Aucune intentionnelle ; baseline de compatibilité possible.
    order: Contexte actuel ou preuve host fraîche → get_training(id confirmé) uniquement si détails demandés ; domain_id explicite pour la suite pédagogique.
    project: name, training_id et état de sélection en UI ; revision/selection_version/provenance conservés ; détails pédagogiques utiles sélectionnés depuis le document réel.
    forbidden: Sélection implicite depuis le dernier domaine global ; confondre revision de formation avec version numérique du curriculum ou version de sélection.
    qualification: Deux conversations avec formations différentes, aucune sélection, sélection changée dans le desktop, formation archivée/inaccessible et preuve host périmée.
  training.select:
    status: TODO
    preconditions: Choix explicite de l'utilisateur résolu dans le dernier ChoiceSet livré du même binding ; homonyme ou ordinal ambigu → clarification.
    reads: [get_training, get_conversation_context]
    mutations: [select_conversation_training]
    order: Résoudre ordinal→ID prouvé → relire document/droits et contexte sélection → préparer id/conversation_id/expected_selection/key → permission réelle → dispatch unique → reçu confirmé → synchroniser état/UI.
    keys: key issue de l'opération durable, non du modèle ; expected_selection dernière version confirmée ; ne jamais ajouter artificiellement id='personal:'+texte utilisateur.
    project: Formation maintenant sélectionnée et reçu actuel ; mettre à jour DialogueSnapshot/desktop sans rejouer l'ancien HostContext.
    forbidden: Sélection sur simple consultation, création/adhésion automatique, réemploi d'un ChoiceSet invalidé, nouvelle clé pour contourner Unknown ou deuxième sélection après init_domain déjà réussi.
    qualification: Vérifier sélection persistée et version incrémentée exactement une fois ; conflit concurrent, choix supprimé, ask/deny/allow et perte de réponse après écriture.
  learning.resume:
    status: TODO ; intégration progressive de LH-08, pas une activation actuelle.
    preconditions: Demande d'apprendre/reprendre/réviser, sélection confirmée et aucun effet inconnu ; session/activité précédente vérifiées, sinon clarification.
    reads: [get_conversation_context, get_learner_context, get_curriculum_snapshot]
    mutations: [start_learning_session, get_next_activity]
    order: Réutiliser l'activité encore valide si l'on attend une réponse ; sinon contexte → curriculum → session canonique → décision d'activité, avec permis et permission pour chaque opération à effet.
    alerts: get_next_activity agrège alertes/miroir ; pas de get_pending_alerts/get_metacognitive_mirror additionnel dans ce tour sauf demande brute explicite.
    project: Compétence, objectifs/critères requis, activité/pedagogical_contract, session, contraintes, motivation et degraded_components nécessaires ; REST/CLOSE_SESSION ne sont pas une fermeture effectuée.
    forbidden: Inventer un session_id, remplacer une tentative en cours, enseigner sous un mauvais domain_id ou prendre DecisionConfirmed pour exercice validé.
    qualification: Sessions ouverte/expirée, interruption avec réponse attendue, absence de formation, contrat non cognitif et changement de sélection pendant permission.
  learning.hint:
    status: TODO
    preconditions: Activité et question réellement livrées, même sélection/révision ; restrictions d'aide et type de tâche connus ; sinon demander sur quoi porte le blocage.
    reads: Aucun outil dédié d'indice identifié dans les contrats examinés ; réutiliser reçu/critères de l'activité, relire le curriculum seulement si nécessaire.
    mutations: Aucune dans le premier incrément ; pas d'appel d'enregistrement inventé pour persister un indice.
    order: Résoudre l'activité courante → vérifier aide autorisée → produire un indice gradué borné → journaliser le contenu effectivement livré et le compteur local.
    project: Question, tentative exacte utile, indice précédent et contraintes ; conserver leurs preuves hors résumé.
    forbidden: Révéler la solution entière au premier blocage, donner un indice à une évaluation qui l'interdit ou présenter hints_used local comme preuve serveur.
    qualification: Je bloque après changement de sujet, reprise après redémarrage, indice répété, évaluation sans aide, annulation du streaming et absence d'activité.
  learning.coach:
    status: TODO
    preconditions: Besoin pédagogique interprété avec son état ; discussion générale possible sans formation, sans en déduire une progression enregistrée.
    reads: get_learner_context pour données manquantes ; get_olm_snapshot si progression explicitement demandée ; miroir seulement hors cycle sur demande appropriée.
    mutations: get_metacognitive_mirror/get_memory_state ont des effets possibles et restent hors chemin simple ; record_affect ou toute observation future requiert contrat, intention et permis spécifiques.
    order: Faits utiles frais → une génération d'explication/action concrète → question ciblée si utile ; réutiliser le miroir déjà fourni par get_next_activity.
    project: Objectif/préférences, notion et difficulté actuelle ; estimations et evidence-backed stages présentées comme telles, avec inconnues et dégradations.
    forbidden: Déduire une maîtrise d'un rôle ou de la qualité du texte LLM, diagnostiquer l'apprenant, autoévaluer sa propre réponse ou annoncer un enregistrement non confirmé.
    qualification: Qualité française/revue pédagogique, adaptation à la tentative, absence de formation et estimations insuffisantes ; le succès protocolaire ne qualifie pas le coaching.

