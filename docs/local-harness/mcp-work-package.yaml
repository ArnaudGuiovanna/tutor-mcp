integration:
  parallelism: MCP-01/02 préparables avec runtime LH-01 ; MCP-03/04 attendent DialogueSnapshot/ChoiceSet LH-03 ; LH-06 consomme les capacités, ne possède aucun transport.
  central_files: acp.rs/harness.rs/executor.rs/host_context.rs attribués à un seul propriétaire par incrément par le principal ; changements coordonnés, pas d'édition concurrente.
  future_surfaces: Modules client resident_mcp/capabilities à créer après contrats ; adaptations mcp.rs/mcp_stdio.rs/call_validation.rs/backend.rs attendues, aucun fichier serveur édité.
  risks:
    - Conserver State entier réutiliserait des preuves/feedback de l'ancien tour ; ne rendre résidents que connexion/catalogue, recréer gardes et preuves actuelles.
    - VerifiedFields est une map plate ; id du candidat et training_id actif peuvent diverger ; résoudre les arguments par étape et source au lieu d'injecter aveuglément tous les champs.
    - Executor détient actuellement le journal pendant l'attente réseau ; un acteur ne doit ni verrouiller l'UI ni casser Dispatched durable avant IO.
    - Le rafraîchissement déjà fait côté desktop, son second stdio et les réinitialisations post-appel peuvent absorber le gain ; mesurer toute la chaîne avant mutualisation.
    - HostContext deny_unknown_fields et ses preuves liées au tour exigent une extension versionnée ; ne pas injecter roles dans les anciens prompts ou désérialiseurs.
    - get_training/list_training_library sont des lectures métier à effets internes possibles ; aucun fast path ne doit esquiver leurs contrôles en les déclarant readOnly.

validation_plan:
  status: TODO ; scénarios prévus, aucun test exécuté dans ce lot documentaire.
  setup: Vrai binaire Tutor inchangé, données temporaires, fixtures identifiées ; doubles de transport uniquement pour couper précisément après acceptation, jamais seules preuves d'effet métier.
  scenarios:
    - T01 — Deux lectures profil successives en HTTP puis stdio ; compter initialize/outils/list/enfants et vérifier faits réellement retournés et journalisés.
    - T02 — Changer compte/tenant/serveur/conversation puis réinjecter un ancien résultat/lease/ChoiceSet ; zéro lecture privée ni dispatch avec ancien binding.
    - T03 — Renouveler bearer/scopes/policy au repos et révoquer durant permission ; anciens leases rejetés et deny réel observé, sans exposer le jeton.
    - T04 — Annonce list_changed au repos et entre deux pages tools/list ; absence de snapshot mixte et aucun appel approuvé sous schéma obsolète.
    - T05 — Tuer stdio, couper HTTP, annuler avant/après dispatch ; vérifier aucun orphelin Windows/Linux, aucun replay et prochain tour indépendant du cancel précédent.
    - T06 — Chercher plus de dix formations homonymes puis demander page suivante/la deuxième ; correspondance au tableau effectivement livré, pas à l'ordre d'une page recalculée.
    - T07 — Sélection effective avec key et expected_selection ; relire via connexion indépendante, constater version +1 et formation correcte ; redémarrage conserve la sélection.
    - T08 — Faire accepter la sélection puis perdre sa réponse ; constater état serveur modifié, opération Unknown et aucun nouvel appel, y compris après rebind/redémarrage.
    - T09 — Modifier la sélection via desktop entre lecture et permission ; conflit réel, jamais écrasement ni nouvelle clé automatique ; état inconnu traité explicitement.
    - T10 — Profil propriétaire/apprenant sans preuve de maîtrise, sans domaine, source refusée et serveur en erreur ; contenu sourcé, aucun profil inventé ni fausse liste vide.
    - T11 — Reprise et indice sur activité réelle puis changement de conversation/formation ; bon domaine/session, aide interdite respectée et aucune interaction d'évaluation ajoutée.
    - T12 — Enregistrement futur/création avec perte de réponse et redémarrage ; compter effets serveur avant/après, aucune duplication, aucune publication ou progression inventée.
  proof: Comparer reçus/journal et état via lecture indépendante ou snapshot du stockage de fixture ; mock, JSON valide et assertion de texte seuls ne prouvent pas la mutation.
  prompt_check: Capturer l'entrée réelle du tokenizer sur fixture ; catalogue/schémas exhaustifs et secrets absents, descriptions de capacités bornées, provenance requise conservée.

