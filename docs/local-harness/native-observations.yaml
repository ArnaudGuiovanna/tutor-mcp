version: 1
title: Observations natives LH-00 — contrat et limites
date: '2026-11-02'
parent_plan: docs/plan-local-harness.yaml
lot_status: IN_PROGRESS
scope: Moteur local, wrapper MCP et worker de l'agent ACP ; pas de mesure du client graphique.
compatibility:
  success: result._meta.tutor.runtime
  error: error.data._meta.tutor.runtime
  version: schemaVersion=1, componentScope=native_agent
  legacy: Les champs result._meta.tutor.generation et leurs significations restent inchangés ; elapsedMs historique couvre le tour ACP.
  absence: Les moteurs simulés peuvent ne pas fournir d'observation ; un rejeu de journal ne mesure pas un nouveau tour.
  privacy: Valeurs numériques, null et enums fixes seulement ; aucun prompt, réponse, nom d'outil, argument, chemin, identifiant privé ou secret dans ces DTO.

clock:
  method: Horloge monotone du processus, millisecondes flottantes ; timingKind=host_wall_clock.
  overlap: Les opérations countInputMs/generationMs sont inclusives ; les phases mesurent des sections distinctes à l'intérieur. Ne jamais additionner opérations, phases et durée worker.
  gaps: La somme des phases ne couvre pas nécessairement l'opération ; validation, préparation de batch et autres sections non mesurées restent hors de cette somme.
  unavailable: null signifie non observé ; zéro signifie une valeur observée égale à zéro ou un compteur initialisé sans opération.
  gpu: Aucun ajout de synchronisation GPU ; gpuSynchronizedMs et cpuTimeMs sont null. Ces durées ne sont ni du temps CPU OS ni du temps GPU attesté.

inference:
  interval: begin_turn_observation remet les mesures à zéro sans décharger les poids ; take_runtime_observation termine et draine l'intervalle.
  standalone: Sans délimitation explicite, l'intervalle commence au premier count_input/generate.
  phases:
    artifact: modelOpenMs, modelHashMs, backendSetupMs, modelLoadMs, modelValidationMs.
    preparation: templateMs, tokenizationMs, contextAllocationMs, batchAllocationMs.
    evaluation: prefillMs pour les decode de prompt ; decodeMs pour les decode autorégressifs.
    output: samplerSetupMs, samplingMs, tokenConversionMs, emitMs.
  first_token: firstTokenMs est le premier token non EOG échantillonné ; il peut appartenir à une décision interne.
  first_emission: firstEmissionMs est le premier callback de texte non vide réussi ; il ne prouve ni réception ACP ni peinture UI.
  useful_response: firstUsefulResponseMs reste null ; la qualification doit établir l'utilité à partir d'un oracle et de l'affichage réel.
  callbacks: emitMs comprend les écritures de journal et la contre-pression effectuées dans le callback ; ne pas l'appeler temps d'affichage.
  counts:
    counted_input: countedInputTokens additionne les résultats de comptage ; ne jamais les ajouter aux tokens effectivement soumis pour génération.
    logical_input: inputTokens compte les prompts complets tokenisés pour les générations, une fois par génération.
    evaluated_input: evaluatedInputTokens compte les tokens de prompt acceptés par les decode réussis ; null après un decode natif échoué à progrès partiel inconnu.
    equality: inputTokens = reusedTokens + evaluatedInputTokens seulement pour un prefill intégralement réussi ; une annulation partielle ou un budget refusé ne satisfait pas cette égalité.
    reused: Zéro dans cet incrément ; les poids restent résidents mais aucun KV n'est réutilisé.
    output: outputTokens compte les tokens non EOG échantillonnés, y compris un token dont la conversion ou le callback échoue.
    loads: modelLoadCount est le compteur de chargements réussis sur la vie du moteur ; modelLoadAttempts est limité à l'observation courante.
    contexts: contextAllocationAttempts et contextAllocations comptent les tentatives et réussites de l'observation ; ce ne sont pas des jauges de contextes vivants.
  outcome: lastOutcome donne la dernière opération ; failedOperations/cancelledOperations couvrent toutes les opérations observées du tour.

mcp:
  connection: connectTotalMs comprend validation de configuration, démarrage du transport et initialize/initialized. Le harness mesure aussi le chemin sans Client retourné.
  operations: catalogTotalMs, toolsCallTotalMs et closeTotalMs agrègent leurs wrappers, erreurs et futures interrompues incluses.
  attempts: Nombre d'invocations de wrapper effectivement pollées ; ni nombre de requêtes sur le fil ni nombre de pages.
  outcomes: Les compteurs TransportSuccesses comptent Result::Ok ; un résultat isError=true est compté séparément dans toolResultErrors et ne prouve aucun succès métier.
  interruption: Future abandonnée sans résultat → compteur Interrupted ; aucune annulation distante ni reprise automatique n'en est déduite.
  drain: take_observation et begin_turn_observation drainent les mesures sans fermer ni rejouer le transport ; récolter avant de détruire le Client.
  unavailable: initializeTotalMs et catalogPages restent null ; le wrapper ne peut pas les isoler. closeTotalMs couvre seulement close explicite, pas les nettoyages internes ou Drop.
  lifecycle: Connexion et catalogue toujours reconstruits par parcours dans cet incrément ; aucun gain de résidence MCP revendiqué.

worker:
  field: workerElapsedMs
  interval: Entrée du worker bloquant → destruction de sa garde, y compris les opérations de journal effectuées dans cette portée.
  missing: Une sortie avant la récolte des observations peut ne pas exposer de DTO ; une absence ne vaut pas une durée nulle.
  boundary: Ne comprend pas toute la file ACP, les attentes IPC ou l'affichage desktop ; l'attente de permission peut être incluse sans être encore isolée.

development_evidence:
  report: docs/local-harness/native-observation-baseline.json
  source_base: 4714d5b965fa3d1844fbd3f12531b973b53d7ea2
  corpus: Huit cas synthétiques connus de qualify-local-context.py et un échec de connexion HTTP ; données Tutor jetables, aucune institution réelle.
  checks: Compteurs cohérents avec generation, lectures sans chargement, poids résidents entre deux générations, refus sans appel et métadonnées sur erreur de connexion.
  native_tests: 206 réussis, zéro échec, deux essais GGUF spéciaux ignorés ; ces derniers ne sont pas déclarés réussis par le rapport.
  quality_limit: Le succès de ces contrôles n'est ni un taux de compréhension, ni une revue de coaching, ni un test indépendant.
  timing_limit: Mesures descriptives sur une VM Linux CPU quatre vCPU ; aucun p95, cache fichier OS non contrôlé, aucune extrapolation P2000.
  trace_cost_report: docs/local-harness/native-observation-overhead.json
  trace_cost: A/B/B/A, deux processus par variante et deux demandes par processus ; huit réponses identiques. Écart descriptif candidat/référence du premier texte d'environ +2.8 % à froid et +9.0 % à chaud.
  trace_cost_limit: Deux mesures par variante/température ne séparent pas instrumentation et charge VM ; essai limité à 71/100 tokens d'entrée et sept tokens de sortie, sans reproduire les lenteurs des prompts longs. Aucun surcoût nul certifié.

remaining_lh00:
  - Corrélations et durées du routage, de l'admission, des permissions humaines et des phases desktop.
  - Premier contenu utile selon oracle, intertokens visibles, mémoire et preuve du placement GPU.
  - Export portable et reproductible avec profils, environnement, corpus indépendant et campagne de fautes complète.
  - Mesures Windows sur i7-9750H/P2000, puis décision par critère ; aucun installateur nouveau livré par ce contrat.
