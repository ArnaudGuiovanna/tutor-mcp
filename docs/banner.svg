<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">Tutor — lifelong learning and learning communities</title>
  <desc id="description">Tutor MCP supports learning throughout your life. The Tutor ACP Windows client brings programmes into learning communities.</desc>
  <defs>
    <style>
      .sans { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      .mono { font-family: "Cascadia Mono", ui-monospace, monospace; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111215"/>
      <stop offset="100%" stop-color="#202126"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.8">
      <stop offset="0%" stop-color="#A79BFF" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#A79BFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#background)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <text x="88" y="66" class="mono" font-size="13" letter-spacing="2" fill="#B7B4C6">OPEN SOURCE · LEARNING THAT CONTINUES</text>

  <g transform="translate(88 90)">
    <g stroke="#A79BFF" stroke-width="1.6" stroke-linecap="round" stroke-opacity="0.7" fill="none">
      <line x1="26" y1="24" x2="50" y2="56"/>
      <line x1="72" y1="18" x2="50" y2="56"/>
      <line x1="82" y1="46" x2="50" y2="56"/>
      <line x1="68" y1="78" x2="50" y2="56"/>
      <line x1="22" y1="70" x2="50" y2="56"/>
      <line x1="44" y1="44" x2="50" y2="56"/>
    </g>
    <g fill="#A79BFF">
      <circle cx="26" cy="24" r="3.6"/>
      <circle cx="72" cy="18" r="2.6"/>
      <circle cx="82" cy="46" r="3.6"/>
      <circle cx="68" cy="78" r="3.6"/>
      <circle cx="22" cy="70" r="3.6"/>
      <circle cx="50" cy="56" r="5"/>
    </g>
    <text x="126" y="76" class="sans" font-size="72" font-weight="650" letter-spacing="-2" fill="#ECEDEF">tutor</text>
  </g>

  <g class="sans" font-size="47" font-weight="600" letter-spacing="-1">
    <text x="88" y="267" fill="#ECEDEF">Keep learning throughout your life.</text>
    <text x="88" y="328" fill="#A79BFF">Grow through learning communities.</text>
  </g>

  <!-- These panels describe the two components; they are not application screenshots. -->
  <g transform="translate(88 392)">
    <rect width="536" height="172" rx="16" fill="#17181B" stroke="#35333F"/>
    <text x="28" y="37" class="mono" font-size="12" letter-spacing="1.5" fill="#B7B4C6">THE LEARNING ENGINE</text>
    <text x="28" y="79" class="sans" font-size="29" font-weight="600" fill="#ECEDEF">Tutor MCP</text>
    <text x="28" y="116" class="sans" font-size="18" fill="#CDCDD5">Your learning, across projects and years.</text>
    <text x="28" y="144" class="sans" font-size="15" fill="#B7B4C6">Personal programmes · practice · reviews · memory</text>
  </g>
  <g transform="translate(648 392)">
    <rect width="544" height="172" rx="16" fill="#17181B" stroke="#35333F"/>
    <text x="28" y="37" class="mono" font-size="12" letter-spacing="1.5" fill="#B7B4C6">THE WINDOWS CLIENT · ACP</text>
    <text x="28" y="79" class="sans" font-size="29" font-weight="600" fill="#ECEDEF">Tutor ACP</text>
    <text x="28" y="116" class="sans" font-size="18" fill="#CDCDD5">Shared programmes. Individual learning journeys.</text>
    <text x="28" y="144" class="sans" font-size="15" fill="#B7B4C6">Learn · contribute · review · share</text>
  </g>
</svg>
