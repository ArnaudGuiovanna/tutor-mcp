[package]
name = "tutor-local-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Local GGUF agent for the Tutor ACP desktop client"

[features]
default = ["inference"]
inference = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2", "dep:encoding_rs"]
cuda = ["inference", "llama-cpp-2/cuda"]
vulkan = ["inference", "llama-cpp-2/vulkan"]

[dependencies]
anyhow = "1"
encoding_rs = { version = "0.8", optional = true }
# The exact binding/sys pair is the one used by Goose alpha.13. Keep them
# together: sys patch releases are not necessarily API compatible.
llama-cpp-2 = { version = "=0.1.146", default-features = false, features = ["sampler"], optional = true }
llama-cpp-sys-2 = { version = "=0.1.146", default-features = false, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
reqwest = { version = "=0.12.24", default-features = false, features = ["json", "rustls-tls"] }
jsonschema = { version = "=0.60.2", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[profile.dev]
debug = 0

[profile.release]
strip = true
