name: Website

on:
  push:
    branches: [main, staging]
    paths: ['ui/site/**', '.github/workflows/website.yml', 'scripts/install.sh', 'scripts/install.ps1']
  pull_request:
    paths: ['ui/site/**', '.github/workflows/website.yml', 'scripts/install.sh', 'scripts/install.ps1']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Website build and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui/site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/site/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: website-browser-results
          path: ui/site/test-results/
          retention-days: 7
