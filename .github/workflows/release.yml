name: Prepare release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to prepare as a draft (for example v0.7.0)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: prepare-release
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The OIDC token and attestation write are scoped to this job only: it
    # signs SLSA build provenance for the archives it has just built.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.11
          # Attested artifacts are built from a cold module and build cache:
          # a cache restored from another workflow could poison what the
          # provenance then vouches for.
          cache: false
      - name: Build archives and checksums
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GOTOOLCHAIN: local
        run: python3 scripts/package-release.py --version "$RELEASE_VERSION"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tutor-mcp_*.tar.gz
            dist/tutor-mcp_*.zip
      - name: Retain release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-archives
          path: dist/*
          retention-days: 30
  publish:
    needs: package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-archives
          path: dist
      - name: Create reviewable draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          gh release create "$RELEASE_VERSION" --draft --target "$GITHUB_SHA" \
            --title "TUTOR MCP $RELEASE_VERSION" --notes-file "docs/release-$RELEASE_VERSION.md" \
            dist/tutor-mcp_*.tar.gz dist/tutor-mcp_*.zip dist/SHA256SUMS \
            dist/THIRD_PARTY_NOTICES_SHA256SUMS dist/THIRD_PARTY_NOTICES_PROVENANCE.json
